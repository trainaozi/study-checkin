  /* ================================================================
     数据看板
     ================================================================ */
  var charts = {};
  function destroyCharts() {
    Object.keys(charts).forEach(function (k) {
      try { charts[k].destroy(); } catch (e) { }
      delete charts[k];
    });
  }
  function mkChart(id, cfg) {
    var c = document.getElementById(id);
    if (!c || typeof window.Chart === 'undefined') return;
    if (charts[id]) { try { charts[id].destroy(); } catch (e) { } }
    try {
      charts[id] = new window.Chart(c, cfg);
    } catch (e) {
      var box = c.parentNode;
      if (box) box.innerHTML = '<div class="chart-empty">图表渲染失败，数据仍已保存</div>';
    }
  }

  function rangeRecords() {
    var n = ui.dashRange;
    if (!n) return S.records.slice();
    var from = A.shiftDays(A.today(), -(n - 1));
    return S.records.filter(function (r) { return r.date >= from; });
  }

  function renderDashboard(root) {
    var recs = rangeRecords();
    var n = ui.dashRange;
    var rangeChips = [[7, '近 7 天'], [30, '近 30 天'], [90, '近 90 天'], [0, '全部']].map(function (c) {
      return '<button class="chip' + (n === c[0] ? ' active' : '') + '" data-act="dash-range" data-v="' + c[0] + '">' + c[1] + '</button>';
    }).join('');

    if (!recs.length) {
      root.innerHTML = '<div class="chip-row mb-16">' + rangeChips + '</div>' +
        '<div class="card rise">' + emptyState({
          emoji: '📊', title: '这个区间还没有打卡数据',
          desc: '完成一次打卡后，这里会出现科目分布、时长趋势和掌握程度统计。',
          action: '<a class="btn btn-primary" href="#/checkin">' + ic('ic-play', 16) + '去打卡</a>'
        }) + '</div>';
      destroyCharts();
      return;
    }

    var totalSec = A.totalDuration(recs);
    var dayset = {}; recs.forEach(function (r) { dayset[r.date] = 1; });
    var activeDays = Object.keys(dayset).length;
    var avgMastery = recs.reduce(function (s, r) { return s + r.mastery; }, 0) / recs.length;

    // 科目聚合
    var subjMap = {};
    recs.forEach(function (r) {
      if (!subjMap[r.subject]) subjMap[r.subject] = { sec: 0, cnt: 0, mSum: 0 };
      subjMap[r.subject].sec += r.durationSec;
      subjMap[r.subject].cnt++;
      subjMap[r.subject].mSum += r.mastery;
    });
    var subjects = Object.keys(subjMap).sort(function (a, b) { return subjMap[b].sec - subjMap[a].sec; });

    // 日期序列
    var days = [];
    if (n) {
      for (var i = n - 1; i >= 0; i--) days.push(A.shiftDays(A.today(), -i));
    } else {
      var keys = Object.keys(dayset).sort();
      var cur = keys[0], last = keys[keys.length - 1], guard = 0;
      while (cur <= last && guard < 800) { days.push(cur); cur = A.shiftDays(cur, 1); guard++; }
    }
    var dayMin = days.map(function (k) {
      return Math.round(A.totalDuration(recs.filter(function (r) { return r.date === k; })) / 60 * 10) / 10;
    });
    var dayCnt = days.map(function (k) {
      return recs.filter(function (r) { return r.date === k; }).length;
    });

    var mCounts = [0, 0, 0, 0, 0];
    recs.forEach(function (r) { mCounts[r.mastery - 1]++; });

    var kpis = [
      { label: '区间总时长', value: (totalSec / 3600).toFixed(1), unit: '小时', foot: A.fmtDur(totalSec), icon: 'ic-clock', tone: 'i-mint' },
      { label: '打卡次数', value: recs.length, unit: '次', foot: '活跃 ' + activeDays + ' 天', icon: 'ic-check', tone: 'i-coral' },
      { label: '日均时长', value: Math.round(totalSec / Math.max(1, activeDays) / 60), unit: '分钟', foot: '按活跃天计算', icon: 'ic-trend', tone: 'i-sky' },
      { label: '平均掌握度', value: avgMastery.toFixed(2), unit: '/5', foot: A.masteryInfo(Math.round(avgMastery)).emoji + ' ' + A.masteryInfo(Math.round(avgMastery)).text, icon: 'ic-star', tone: 'i-amber' },
      { label: '覆盖科目', value: subjects.length, unit: '个', foot: '最多：' + subjects[0], icon: 'ic-book', tone: 'i-violet' }
    ];

    root.innerHTML =
      '<div class="chip-row mb-16">' + rangeChips +
      '<span style="flex:1"></span>' +
      '<button class="chip" data-act="export-csv">' + ic('ic-download', 13) + ' 导出 CSV</button></div>' +
      '<div class="grid grid-kpi mb-16">' + kpis.map(kpi).join('') + '</div>' +

      '<div class="grid grid-2 mb-16">' +
      '<div class="card rise" style="--d:.06s">' +
      '<div class="card-head"><div class="card-title"><span class="dot"></span>科目时长分布</div>' +
      '<span class="card-desc">共 ' + subjects.length + ' 个科目</span></div>' +
      '<div class="chart-box"><canvas id="ch-subject"></canvas></div></div>' +
      '<div class="card rise" style="--d:.12s">' +
      '<div class="card-head"><div class="card-title"><span class="dot sec"></span>掌握程度统计</div>' +
      '<span class="card-desc">按打卡次数</span></div>' +
      '<div class="chart-box"><canvas id="ch-mastery"></canvas></div></div>' +
      '</div>' +

      '<div class="card rise mb-16" style="--d:.16s">' +
      '<div class="card-head"><div class="card-title"><span class="dot"></span>学习时长趋势</div>' +
      '<span class="card-desc">主色为时长（分钟），副色为打卡次数</span></div>' +
      '<div class="chart-box tall"><canvas id="ch-trend"></canvas></div></div>' +

      '<div class="grid grid-2">' +
      '<div class="card rise" style="--d:.2s">' +
      '<div class="card-head"><div class="card-title"><span class="dot sec"></span>各科目平均掌握度</div>' +
      '<span class="card-desc">满分 5</span></div>' +
      '<div class="chart-box"><canvas id="ch-subj-mastery"></canvas></div></div>' +
      '<div class="card rise" style="--d:.24s">' +
      '<div class="card-head"><div class="card-title"><span class="dot"></span>科目投入排行</div>' +
      '<span class="card-desc">时长占比</span></div>' +
      '<div style="margin-top:6px">' +
      subjects.slice(0, 8).map(function (s, i) {
        return barLine(s, subjMap[s].sec, subjMap[subjects[0]].sec, A.colorFor(s, i), i);
      }).join('') +
      '</div></div></div>';

    if (typeof window.Chart === 'undefined') return;
    var Chart = window.Chart;
    Chart.defaults.font.family = '"PingFang SC","Microsoft YaHei",system-ui,sans-serif';
    Chart.defaults.font.size = 12;
    Chart.defaults.color = '#8AA3AB';
    var narrow = window.innerWidth < 760;
    var subjSecs = subjects.map(function (s) { return subjMap[s].sec; });

    mkChart('ch-subject', {
      type: 'doughnut',
      data: {
        labels: subjects,
        datasets: [{
          data: subjSecs.map(function (v) { return Math.round(v / 60 * 10) / 10; }),
          backgroundColor: subjects.map(function (s, i) { return A.colorFor(s, i); }),
          borderColor: '#fff', borderWidth: 2, hoverOffset: 8
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false, cutout: '60%',
        animation: { animateRotate: true, duration: 900 },
        plugins: {
          legend: {
            position: narrow ? 'bottom' : 'right',
            labels: { usePointStyle: true, pointStyle: 'circle', boxWidth: 8, boxHeight: 8, padding: 12 }
          },
          tooltip: {
            callbacks: {
              label: function (c) {
                var sec = subjSecs[c.dataIndex];
                var pct = totalSec ? (sec / totalSec * 100).toFixed(1) : '0';
                return ' ' + c.label + ' · ' + A.fmtDur(sec) + ' (' + pct + '%)';
              }
            }
          }
        }
      }
    });

    mkChart('ch-mastery', {
      type: 'bar',
      data: {
        labels: A.MASTERY.map(function (m) { return m.emoji + ' ' + m.text; }),
        datasets: [{
          data: mCounts, borderRadius: 10, maxBarThickness: 46,
          backgroundColor: ['#C9D6DA', '#9FD37E', '#7FB3F5', '#3FBFA0', '#FF9E7A']
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: function (c) { return ' ' + c.raw + ' 次'; } } }
        },
        scales: {
          x: { grid: { display: false } },
          y: { beginAtZero: true, grid: { color: '#EFF5F4' }, ticks: { precision: 0 } }
        }
      }
    });

    mkChart('ch-trend', {
      type: 'line',
      data: {
        labels: days.map(function (k) { return A.fmtDateCN(k, false); }),
        datasets: [
          {
            label: '学习时长（分钟）', data: dayMin, yAxisID: 'y',
            borderColor: '#3FBFA0', backgroundColor: 'rgba(63,191,160,.16)',
            fill: true, tension: .38, borderWidth: 2.6, pointRadius: days.length > 40 ? 0 : 3,
            pointBackgroundColor: '#fff', pointBorderColor: '#3FBFA0', pointBorderWidth: 2
          },
          {
            label: '打卡次数', data: dayCnt, yAxisID: 'y1',
            borderColor: '#FF9E7A', backgroundColor: 'rgba(255,158,122,.12)',
            fill: false, tension: .38, borderWidth: 2, borderDash: [5, 4],
            pointRadius: days.length > 40 ? 0 : 2.5
          }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { labels: { usePointStyle: true, pointStyle: 'circle', boxWidth: 8, padding: 14 } },
          tooltip: {
            callbacks: {
              label: function (c) {
                return c.datasetIndex === 0 ? ' 时长 ' + c.raw + ' 分钟' : ' 打卡 ' + c.raw + ' 次';
              }
            }
          }
        },
        scales: {
          x: { grid: { display: false }, ticks: { maxRotation: 0, autoSkip: true, maxTicksLimit: narrow ? 5 : 10 } },
          y: { beginAtZero: true, grid: { color: '#EFF5F4' }, title: { display: !narrow, text: '分钟' } },
          y1: { beginAtZero: true, position: 'right', grid: { display: false }, ticks: { precision: 0 }, title: { display: !narrow, text: '次数' } }
        }
      }
    });

    mkChart('ch-subj-mastery', {
      type: 'bar',
      data: {
        labels: subjects,
        datasets: [{
          data: subjects.map(function (s) { return Math.round(subjMap[s].mSum / subjMap[s].cnt * 100) / 100; }),
          backgroundColor: subjects.map(function (s, i) { return A.colorFor(s, i); }),
          borderRadius: 8, maxBarThickness: 22
        }]
      },
      options: {
        indexAxis: 'y', responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: function (c) {
                return ' 平均 ' + c.raw + ' · ' + A.masteryInfo(Math.round(c.raw)).text +
                  ' · ' + subjMap[c.label].cnt + ' 次';
              }
            }
          }
        },
        scales: {
          x: { beginAtZero: true, max: 5, ticks: { stepSize: 1 }, grid: { color: '#EFF5F4' } },
          y: { grid: { display: false } }
        }
      }
    });
  }

  /* ================================================================
     历史记录
     ================================================================ */
  function filteredRecords() {
    var f = ui.filters;
    var kw = (f.kw || '').trim().toLowerCase();
    return S.records.filter(function (r) {
      if (f.from && r.date < f.from) return false;
      if (f.to && r.date > f.to) return false;
      if (f.subject && r.subject !== f.subject) return false;
      if (f.mastery && String(r.mastery) !== String(f.mastery)) return false;
      if (kw) {
        var hay = (r.task + ' ' + r.subject + ' ' + r.note + ' ' + r.focus).toLowerCase();
        if (hay.indexOf(kw) < 0) return false;
      }
      return true;
    }).sort(function (a, b) {
      return (b.date < a.date ? -1 : b.date > a.date ? 1 : (b.startedAt || 0) - (a.startedAt || 0));
    });
  }

  function historyRecordsHTML() {
    var list = filteredRecords();
    if (!list.length) {
      return emptyState({
        emoji: '🔍', title: '没有符合条件的记录',
        desc: S.records.length ? '试着放宽筛选条件。' : '完成第一次打卡后，明细会出现在这里。',
        action: S.records.length ? '<button class="btn" data-act="filter-reset">重置筛选</button>'
          : '<a class="btn btn-primary" href="#/checkin">去打卡</a>'
      });
    }
    var sec = A.totalDuration(list);
    var rows = list.map(function (r) {
      var m = A.masteryInfo(r.mastery);
      return '<tr>' +
        '<td data-label="日期" class="td-mono">' + esc(r.date) + '<br><span class="td-dim" style="font-size:11px">周' +
        A.WEEK_CN[A.weekdayOf(r.date)] + '</span></td>' +
        '<td data-label="科目">' + subjectTag(r.subject) + '</td>' +
        '<td data-label="任务" class="cell-note">' + esc(r.task) + '</td>' +
        '<td data-label="今日具体项目" class="cell-note td-dim">' + (r.focus ? esc(r.focus) : '—') + '</td>' +
        '<td data-label="时段" class="td-mono td-dim">' + A.fmtTimeOfDay(r.startedAt) + '–' + A.fmtTimeOfDay(r.endedAt) + '</td>' +
        '<td data-label="时长" class="td-mono"><b>' + esc(A.fmtDur(r.durationSec)) + '</b></td>' +
        '<td data-label="掌握度">' + m.emoji + ' ' + esc(m.text) + '</td>' +
        '<td data-label="备注" class="cell-note td-dim">' + (r.note ? esc(r.note) : '—') + '</td>' +
        '<td data-label="操作"><button class="btn btn-sm btn-danger" data-act="rec-delete" data-id="' + r.id + '">删除</button></td>' +
        '</tr>';
    }).join('');

    return '<div class="card-desc mb-16">共 <b style="color:var(--primary-dark)">' + list.length +
      '</b> 条记录 · 合计 <b style="color:var(--primary-dark)">' + esc(A.fmtDur(sec)) +
      '</b> · 平均单次 ' + esc(A.fmtDur(sec / list.length)) + '</div>' +
      '<div class="table-wrap"><table class="tbl"><thead><tr>' +
      ['日期', '科目', '任务', '今日具体项目', '时段', '时长', '掌握度', '备注', '操作']
        .map(function (h) { return '<th>' + h + '</th>'; }).join('') +
      '</tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  function historyArchiveHTML() {
    var f = ui.filters;
    var keys = {};
    S.records.forEach(function (r) { keys[r.date] = 1; });
    Object.keys(S.days).forEach(function (k) {
      if (Object.keys(S.days[k].focus || {}).length) keys[k] = 1;
    });
    keys[A.today()] = 1;
    var list = Object.keys(keys).filter(function (k) {
      if (f.from && k < f.from) return false;
      if (f.to && k > f.to) return false;
      return true;
    }).sort().reverse().slice(0, 120);

    if (!list.length) return emptyState({ emoji: '📚', title: '暂无归档', desc: '每一天的计划与「今日具体项目」都会在这里留档。' });

    return list.map(function (k, idx) {
      var plans = A.plansOfDay(k);
      var recs = A.recordsOfDay(k);
      var done = plans.filter(function (p) { return A.isTaskDone(k, p.id); }).length;
      var sec = A.totalDuration(recs);
      var rel = A.relDayLabel(k);
      var items = plans.map(function (p) {
        var d = A.isTaskDone(k, p.id);
        var focus = A.focusOf(k, p.id);
        var ds = A.durationOfTask(k, p.id);
        var rs = A.recordsOfTask(k, p.id);
        return '<div class="plan-item' + (d ? ' done' : '') + '" style="margin-bottom:8px">' +
          '<div class="plan-item-head"><div class="plan-task" style="font-size:13.5px">' + esc(p.task) + '</div>' +
          (d ? '<span class="tag tag-done">✓ ' + esc(A.fmtDur(ds)) + '</span>' : '<span class="tag tag-pending">未完成</span>') + '</div>' +
          '<div class="plan-meta">' + subjectTag(p.subject) + timeRangeHTML(p.startTime, p.endTime) +
          (rs.length ? rs.map(function (r) { return masteryTag(r.mastery); }).join('') : '') + '</div>' +
          (focus ? '<div class="plan-focus"><span class="fl">今日具体项目：</span>' + esc(focus) + '</div>' : '') +
          (rs.filter(function (r) { return r.note; }).length
            ? '<div class="plan-note">' + rs.filter(function (r) { return r.note; })
              .map(function (r) { return '备注：' + esc(r.note); }).join('<br>') + '</div>' : '') +
          '</div>';
      }).join('');

      var orphan = recs.filter(function (r) { return !plans.some(function (p) { return p.id === r.planId; }); });
      var orphanHTML = orphan.length ? orphan.map(function (r) {

  /* ================================================================
     CSV / JSON
     ================================================================ */
  function download(filename, content, mime) {
    try {
      var blob = new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(function () {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 400);
      return true;
    } catch (e) {
      A.toast('导出失败：浏览器限制了下载', 'warn');
      return false;
    }
  }
  function csvCell(v) {
    var s = (v === null || v === undefined) ? '' : String(v);
    if (/[",\r\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }
  function exportCSV() {
    var list = (ui.route === 'history') ? filteredRecords() : S.records.slice().sort(function (a, b) {
      return b.date < a.date ? -1 : b.date > a.date ? 1 : 0;
    });
    if (!list.length) { A.toast('没有可导出的记录', 'warn'); return; }
    var head = ['日期', '星期', '科目', '任务', '今日具体项目', '计划开始', '计划结束',
      '实际开始', '实际结束', '时长(分钟)', '时长(小时)', '掌握程度', '掌握评分', '备注'];
    var rows = list.map(function (r) {
      var m = A.masteryInfo(r.mastery);
      return [r.date, '周' + A.WEEK_CN[A.weekdayOf(r.date)], r.subject, r.task, r.focus,
      r.planStart, r.planEnd, A.fmtTimeOfDay(r.startedAt), A.fmtTimeOfDay(r.endedAt),
      A.minutesOf(r.durationSec), (r.durationSec / 3600).toFixed(2), m.text, r.mastery, r.note]
        .map(csvCell).join(',');
    });
    var csv = '\ufeff' + [head.map(csvCell).join(',')].concat(rows).join('\r\n');
    if (download('学习打卡记录_' + A.today() + '.csv', csv, 'text/csv;charset=utf-8')) {
      A.toast('已导出 ' + list.length + ' 条记录', 'ok');
    }
  }

  ACT['plan-save'] = function (form) {
    var fd = {};
    ['subject', 'task', 'startTime', 'endTime', 'repeatType', 'date', 'note'].forEach(function (k) {
      var el = form.querySelector('[name="' + k + '"]');
      fd[k] = el ? String(el.value || '').trim() : '';
    });
    if (!fd.subject) { A.toast('请填写科目', 'warn'); return; }
    if (!fd.task) { A.toast('请填写任务描述', 'warn'); return; }
    if (!A.isTimeStr(fd.startTime) || !A.isTimeStr(fd.endTime)) { A.toast('请填写有效的起止时间', 'warn'); return; }
    if (A.timeToMin(fd.endTime) <= A.timeToMin(fd.startTime)) { A.toast('结束时间需晚于开始时间', 'warn'); return; }
    var weekdays = (ui.form.weekdays || []).slice();
    if (fd.repeatType === 'weekly' && !weekdays.length) { A.toast('请选择至少一个星期', 'warn'); return; }
    var onDate = /^\d{4}-\d{2}-\d{2}$/.test(fd.date) ? fd.date : A.today();

    var editing = ui.form.id ? A.planById(ui.form.id) : null;
    if (editing) {
      editing.subject = fd.subject;
      editing.task = fd.task;
      editing.startTime = fd.startTime;
      editing.endTime = fd.endTime;
      editing.note = fd.note;
      editing.repeat = {
        type: fd.repeatType, date: onDate,
        since: fd.repeatType === 'once' ? onDate : (editing.repeat.since || A.today()),
        weekdays: weekdays
      };
      editing.updatedAt = Date.now();
      A.toast('计划已更新', 'ok');
    } else {
      S.plans.push({
        id: A.uid('plan'), subject: fd.subject, task: fd.task,
        startTime: fd.startTime, endTime: fd.endTime,
        repeat: {
          type: fd.repeatType, date: onDate,
          since: fd.repeatType === 'once' ? onDate : A.today(),
          weekdays: weekdays
        },
        note: fd.note, createdAt: Date.now(), updatedAt: Date.now()
      });
      A.toast('计划已添加', 'ok');
    }
    A.save();
    ui.form = defaultForm();
    refreshPlanForm();
    refreshPlanList();
    A.renderNav();
  };

        data: {
          version: merged.version, createdAt: merged.createdAt, updatedAt: merged.updatedAt,
          plans: merged.plans, days: merged.days, records: merged.records, timer: merged.timer,
          tombstones: merged.tombstones || { plans: {}, records: {} },
          meta: {
            lastOpen: (merged.meta && merged.meta.lastOpen) || A.today(),
            notice: (merged.meta && merged.meta.notice) || '',
            sync: merged.meta.sync
          }
        }
      };
      return ghFetch('/gists/' + session.gistId, {
        method: 'PATCH',
        body: JSON.stringify({ files: createFiles(payload) })
      }).then(function () {
        applyStore(merged);
        refreshUI();
        setState('ok', '已同步', { lastSyncAt: Date.now() });
      });
    });
  }

  function pull() {
    if (!session) return Promise.reject(new Error('尚未连接云同步'));
    setState('syncing', '正在拉取云端…');
    return ghFetch('/gists/' + session.gistId).then(function (gist) {
      var file = gist.files && gist.files[GIST_FILENAME];
      if (!file || !file.content) { setState('ok', '云端暂无数据'); return { changed: false }; }
      var payload;
      try { payload = JSON.parse(file.content); } catch (e) { setState('error', '云端数据解析失败'); return { changed: false }; }
      var remote = payload.data;
      if (!remote) { setState('ok', '云端暂无数据'); return { changed: false }; }
      var before = snapshotCount(A.store);
      var merged = mergeStore(A.store, remote);
      merged.meta = merged.meta || {};
      merged.meta.sync = {
        rev: payload.rev || 0,
        lastSyncAt: (A.store.meta.sync ? A.store.meta.sync.lastSyncAt : 0),
        lastPullAt: Date.now()
      };
      applyStore(merged);
      refreshUI();
      var after = snapshotCount(A.store);
      var diff = after - before;
      setState('ok', '已合并云端（' + (diff >= 0 ? '+' : '') + diff + ' 项）', { lastPullAt: Date.now() });
      return { changed: diff !== 0 };
    });
  }

  /* ============================================================ 自动同步 */
  function wrapSave() {
    if (wrapped) return; wrapped = true;
    origSave = A.save;
    A.save = function () {
      var r = origSave.apply(A, arguments);
      onLocalChange();
      return r;
    };
  }
  function onLocalChange() {
    if (!session || !session.autoSync) return;
    if (state.status === 'syncing') return;
    clearTimeout(autoTimer);
    autoTimer = setTimeout(function () {
      push().then(function () { }).catch(function (e) { reportError(e); });
    }, 2500);
  }

  /* ============================================================ UI：状态机 */
  function fmtTime(ts) {
    if (!ts) return '';
    var d = new Date(ts);
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function statusText() {
    if (state.status === 'idle') return '未同步';
    if (state.status === 'locked') return '已加密';
    if (state.status === 'syncing') return '同步中…';
    if (state.status === 'error') return '同步失败';
    if (state.status === 'ok') return '已同步' + (state.lastSyncAt ? ' ' + fmtTime(state.lastSyncAt) : '');
    return '云同步';
  }
  function setState(status, message, extra) {
    state.status = status;
    state.message = message || '';
    if (extra) {
      if (extra.lastSyncAt) state.lastSyncAt = extra.lastSyncAt;
      if (extra.lastPullAt) state.lastPullAt = extra.lastPullAt;
    }
    updatePill();
    updateCard();
  }
  function reportError(e) {
    state.lastError = (e && e.message) || String(e);
    setState('error', '同步失败：' + state.lastError);
  }

  function syncPillInner() {
    var icon = state.status === 'syncing'
      ? '<span class="spin">' + svgUse('ic-sync', 14) + '</span>'
      : (state.status === 'error' ? '⚠' : (state.status === 'locked' ? '🔒' : '☁'));
    return '<span class="dot-sync"></span>' + icon + '<span>' + statusText() + '</span>';
  }
  function svgUse(id, size) {
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24"><use href="#' + id + '"/></svg>';
  }
  function injectPill() {
    var box = A.$('#page-actions');
    if (!box) return;
    var pill = document.createElement('button');
    pill.className = 'sync-pill sync-' + state.status;
    pill.setAttribute('data-act', 'sync-open');
    pill.title = '云同步：' + statusText();
    pill.innerHTML = syncPillInner();
    box.appendChild(pill);
  }
  function updatePill() {
    var el = A.$('.sync-pill');
    if (el) {
      el.className = 'sync-pill sync-' + state.status;
      el.title = '云同步：' + statusText();
      el.innerHTML = syncPillInner();
    }
  }
  function updateCard() {
    var st = A.$('#sync-card-status');
    if (st) st.textContent = session ? statusText() : (state.status === 'locked' ? '已加密，需解锁口令' : '未连接，点击配置');
    var btn = A.$('#sync-card-btn');
    if (btn) {
      btn.disabled = !session;
      btn.textContent = session ? '立即同步' : '需先连接';
    }
  }
  function refreshUI() {
    try {
      var root = A.$('#view-' + A.ui.route);
      if (root) A.renderView(A.ui.route, root);
      A.renderPageActions();
      A.renderNav();
      A.syncTimerUI();
    } catch (e) { /* 不应影响同步 */ }
  }
  function refreshAll() { refreshUI(); updatePill(); updateCard(); }

  /* ============================================================ 弹窗 UI */
  function openPanel() {
    if (!session && hasVault()) renderUnlock();
    else if (!session) renderConnect();
    else renderManage();
  }

  function renderConnect() {
    A.openModal({
      title: '连接云同步',
      sub: '把打卡数据加密备份到你的 GitHub 私有 Gist',
      body:
        '<form data-submit="sync-connect">' +
        '<div class="form-row"><label class="lbl">GitHub 访问令牌 (Token)</label>' +
        '<input class="input" type="password" name="token" data-autofocus placeholder="ghp_xxx 或 github_pat_xxx">' +
        '<div class="hint">需要带 <b>gist</b> 权限的 Personal Access Token。' +
        '<a href="https://github.com/settings/tokens" target="_blank" rel="noopener">前往创建 →</a> ' +
        '令牌仅保存在本机（经口令加密），用于读写你自己的备份 Gist。</div></div>' +
        '<div class="form-row"><label class="lbl">同步口令（用于加密本地令牌）</label>' +
        '<input class="input" type="password" name="pass" placeholder="设置一段口令，至少 6 位">' +
        '<div class="hint">遗忘后无法恢复云端备份，请牢记。</div></div>' +
        '<div class="form-row"><label class="lbl">确认口令</label>' +
        '<input class="input" type="password" name="pass2" placeholder="再次输入口令"></div>' +
        '<div class="form-row"><label class="lbl">已有备份 Gist ID（可选）</label>' +
        '<input class="input" type="text" name="gistId" placeholder="留空则自动复用账号下的备份">' +
        '<div class="hint">同一 GitHub 账号下会<b>自动复用</b>已有的学习打卡备份 Gist（多个旧备份会自动合并），因此电脑和手机用同一个令牌即可自动同步，无需手动填写。仅当你想指向某个特定备份时才填这里。</div></div>' +
        '<div class="form-row" style="flex-direction:row;align-items:center;gap:10px">' +
        '<label class="switch on" data-act="sync-toggle-auto" style="margin:0">自动同步</label>' +
        '<span class="hint" style="margin:0">开启后，本地改动会自动上传到云端</span></div>' +
        '<div class="modal-foot">' +
        '<button type="button" class="btn" data-act="modal-close">取消</button>' +
        '<button type="submit" class="btn btn-primary">保存并连接</button></div>' +
        '</form>',
      maskClose: false
    });
  }

  function renderUnlock() {
    A.openModal({
      title: '解锁云同步',
      sub: '输入同步口令以解密本地令牌并拉取云端数据',
      body:
        '<form data-submit="sync-unlock">' +
        '<div class="form-row"><label class="lbl">同步口令</label>' +
        '<input class="input" type="password" name="pass" data-autofocus placeholder="输入之前设置的口令">' +
        '<div class="hint">解锁后会自动从云端拉取并合并数据到本机。</div></div>' +
        '<div class="modal-foot">' +
        '<button type="button" class="btn" data-act="modal-close">取消</button>' +
        '<button type="submit" class="btn btn-primary">解锁并同步</button></div>' +
        '</form>',
      maskClose: false
    });
  }

  function renderManage() {
    var gid = session.gistId || '—';
    var masked = gid.length > 8 ? (gid.slice(0, 4) + '…' + gid.slice(-4)) : gid;
    A.openModal({
      title: '云同步管理',
      sub: '数据已加密备份到 GitHub 私有 Gist',
      body:
        '<div class="kv"><span>备份 Gist</span><b style="display:flex;align-items:center;gap:8px">' + A.esc(masked) +
        '<button type="button" class="btn btn-sm" data-act="sync-copy-gist" title="复制完整 Gist ID 到剪贴板">复制</button></b></div>' +
        '<div class="kv"><span>同步状态</span><b>' + A.esc(statusText()) + '</b></div>' +
        (state.lastSyncAt ? '<div class="kv"><span>上次同步</span><b>' + fmtTime(state.lastSyncAt) + '</b></div>' : '') +
        (state.lastPullAt ? '<div class="kv"><span>上次拉取</span><b>' + fmtTime(state.lastPullAt) + '</b></div>' : '') +
        (state.lastError ? '<div class="hint" style="color:var(--secondary-ink)">最近错误：' + A.esc(state.lastError) + '</div>' : '') +
        '<div class="form-row" style="flex-direction:row;align-items:center;gap:10px;margin-top:8px">' +
        '<label class="switch ' + (session.autoSync ? 'on' : '') + '" data-act="sync-toggle-auto" style="margin:0">自动同步</label>' +
        '<span class="hint" style="margin:0">' + (session.autoSync ? '已开启：本地改动自动上传' : '已关闭：仅手动同步') + '</span></div>' +
        '<div class="chip-row" style="margin-top:14px">' +
        '<button class="btn btn-sm btn-primary" data-act="sync-now">立即同步</button>' +
        '<button class="btn btn-sm" data-act="sync-change-pass">更改口令</button>' +
        '<button class="btn btn-sm" data-act="sync-lock">锁定</button>' +
        '<button class="btn btn-sm btn-danger" data-act="sync-disconnect">断开并清除</button>' +
        '</div>',
      maskClose: true
    });
  }

  function openChangePass() {
    A.openModal({
      title: '更改同步口令',
      sub: '将用新口令重新加密本地令牌',
      body:
        '<form data-submit="sync-pass-submit">' +
        '<div class="form-row"><label class="lbl">新口令</label>' +
        '<input class="input" type="password" name="np" data-autofocus placeholder="至少 6 位"></div>' +
        '<div class="form-row"><label class="lbl">确认新口令</label>' +
        '<input class="input" type="password" name="np2" placeholder="再次输入"></div>' +
        '<div class="modal-foot">' +
        '<button type="button" class="btn" data-act="modal-close">取消</button>' +
        '<button type="submit" class="btn btn-primary">更新</button></div>' +
        '</form>',
      maskClose: false
    });
  }

  /* ============================================================ 行为 */
  function handleConnect(form) {
    var token = (form.querySelector('[name=token]').value || '').trim();
    var pass = form.querySelector('[name=pass]').value;
    var pass2 = form.querySelector('[name=pass2]').value;
    var gistId = (form.querySelector('[name=gistId]').value || '').trim();
    if (!token) { A.toast('请填写 GitHub 令牌', 'warn'); return; }
    if (pass.length < 6) { A.toast('同步口令至少 6 位', 'warn'); return; }
    if (pass !== pass2) { A.toast('两次口令不一致', 'warn'); return; }

    state.lastError = '';
    setState('syncing', '正在连接…');
    session = { token: token, gistId: gistId || null, autoSync: true, pass: pass };
    var p;
    if (gistId) {
      p = validateGist().then(function (ok) { if (!ok) throw new Error('Gist ID 无效或无权限'); });
    } else {
      // 自动发现：留空则复用账号下已有的备份 Gist（多份旧备份会自动合并）
      p = discoverGist().then(function (gid) {
        if (gid) { session.gistId = gid; return; }
        return createGist();
      });
    }
    p.then(function () { return persistSession(); })
      .then(function () { return push(); })
      .then(function () { A.closeModal(); A.toast('云同步已连接', 'ok'); refreshAll(); })
      .catch(function (e) { reportError(e); A.toast('连接失败：' + (e.message || e), 'warn'); });
  }

  function handleUnlock(form) {
    var pass = form.querySelector('[name=pass]').value;
    if (!pass) { A.toast('请输入口令', 'warn'); return; }
    var vault = loadVault();
    if (!vault) { A.toast('没有可用的加密备份', 'warn'); return; }
    setState('syncing', '正在解锁…');
    decryptJSON(vault, pass).then(function (creds) {
      creds.pass = pass;
      session = creds;
      return pull();
    }).then(function () { A.closeModal(); A.toast('已解锁并合并云端数据', 'ok'); refreshAll(); })
      .catch(function () { reportError(new Error('解锁失败：口令错误或服务异常')); A.toast('解锁失败：口令错误或服务异常', 'warn'); });
  }

  function handleChangePass(form) {
    var np = form.querySelector('[name=np]').value;
    var np2 = form.querySelector('[name=np2]').value;
    if (np.length < 6) { A.toast('新口令至少 6 位', 'warn'); return; }
    if (np !== np2) { A.toast('两次口令不一致', 'warn'); return; }
    session.pass = np;
    persistSession()
      .then(function () { A.closeModal(); A.toast('口令已更新', 'ok'); renderManage(); })
      .catch(function (e) { A.toast('更新失败：' + (e.message || e), 'warn'); });
  }

  function lock() {
    session = null;
    setState('locked', '已加密');
    updatePill(); updateCard();
    A.toast('已锁定', 'ok');
    if (A.$('.modal-mask')) { A.closeModal(); openPanel(); }
  }

  function disconnect() {
    A.confirmModal({
      title: '断开云同步',
      sub: '将清除本机保存的加密令牌，云端 Gist 不会被删除。',
      okText: '断开并清除', danger: true
    }, function () {
      clearVault();
      session = null;
      setState('idle', '未连接');
      refreshAll();
      A.toast('已断开', 'ok');
    });
  }

  /* ============================================================ 动作注册 */
  A.ACTIONS['sync-open'] = function () { openPanel(); };
  A.ACTIONS['sync-copy-gist'] = function () {
    if (!session || !session.gistId) { A.toast('尚未连接', 'warn'); return; }
    var id = session.gistId;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(id).then(function () { A.toast('已复制 Gist ID', 'ok'); })
        .catch(function () { fallbackCopy(id); });
    } else fallbackCopy(id);
  };
  function fallbackCopy(text) {
    try {
      var ta = document.createElement('textarea'); ta.value = text;
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
      A.toast('已复制 Gist ID', 'ok');
    } catch (e) { A.toast('复制失败，请手动记录：' + text, 'warn'); }
  }
  A.ACTIONS['sync-connect'] = function (form) { handleConnect(form); };
  A.ACTIONS['sync-unlock'] = function (form) { handleUnlock(form); };
  A.ACTIONS['sync-pass-submit'] = function (form) { handleChangePass(form); };
  A.ACTIONS['sync-change-pass'] = function () { openChangePass(); };
  A.ACTIONS['sync-lock'] = function () { lock(); };
  A.ACTIONS['sync-disconnect'] = function () { disconnect(); };
  A.ACTIONS['sync-toggle-auto'] = function () {
    if (!session) { openPanel(); return; }
    session.autoSync = !session.autoSync;
    persistSession().then(function () {
      A.toast('自动同步：' + (session.autoSync ? '开' : '关'));
      if (A.$('.modal-mask')) openPanel(); else updateCard();
    });
  };
  A.ACTIONS['sync-now'] = function () {
    if (!session) { openPanel(); return; }
    push().then(function () { A.toast('已同步', 'ok'); if (A.$('.modal-mask')) openPanel(); })
      .catch(function (e) { A.toast('同步失败：' + (e.message || e), 'warn'); });
  };

  /* ============================================================ 启动 */
  function init() {
    try {
      ensureMetaSync();
      if (hasVault()) { state.status = 'locked'; state.message = '已加密'; }
      else { state.status = 'idle'; state.message = '未连接'; }

      // 包裹 save，实现自动同步
      wrapSave();

      // 顶栏状态 pill（renderPageActions 每次导航会重新注入）
      var _origRPA = A.renderPageActions;
      A.renderPageActions = function () { _origRPA(); injectPill(); };

      injectPill();
      updateCard();
    } catch (e) { /* 绝不影响主程序 */ }
  }

  /* ============================================================ 暴露 */
  window.Sync = {
    init: init, push: push, pull: pull, openPanel: openPanel, lock: lock, disconnect: disconnect,
    _t: {
      mergeEntities: mergeEntities, mergeTomb: mergeTomb, mergeDays: mergeDays, mergeTimer: mergeTimer,
      mergeStore: mergeStore, encryptJSON: encryptJSON, decryptJSON: decryptJSON,
      cloneStore: cloneStore, buildPayload: function () { return { rev: 0 }; },
      loadVault: loadVault, saveVault: saveVault, clearVault: clearVault, hasVault: hasVault,
      setSession: function (s) { session = s; }, getSession: function () { return session; },
      getState: function () { return state; }, ensureMetaSync: ensureMetaSync,
      setState: setState, push: push, pull: pull
    }
  };

  init();
})();

</script>
</body>
</html>
