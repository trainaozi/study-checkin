<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#3FBFA0">
<meta name="description" content="纯离线学习打卡工具：每日计划、计时打卡、数据看板与历史归档，数据保存在本地浏览器。">
<title>晨露学习打卡 · Study Check-in</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%233FBFA0'/%3E%3Cpath d='M18 33l9 9 19-19' stroke='white' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* ==========================================================================
   晨露学习打卡 · 样式层
   小清新配色：主色 mint / 副色 coral，浅色背景，柔和阴影
   ========================================================================== */

:root {
  --primary: #3FBFA0;
  --primary-dark: #2E9E83;
  --primary-soft: #E3F7F1;
  --primary-soft-2: #F2FCF9;

  --secondary: #FF9E7A;
  --secondary-ink: #E4714B;
  --secondary-soft: #FFEEE6;

  --accent: #7FB3F5;
  --accent-ink: #4A86D8;
  --accent-soft: #E9F2FE;

  --violet: #B39BE8;
  --violet-soft: #F1EBFD;
  --amber: #F7C56B;
  --amber-soft: #FEF4E2;

  --ink: #2B4249;
  --ink-2: #4A6670;
  --muted: #8AA3AB;
  --line: #E3EFEC;
  --line-2: #EFF5F4;

  --bg: #F2FAF8;
  --card: #FFFFFF;

  --radius-lg: 20px;
  --radius: 16px;
  --radius-sm: 10px;

  --shadow-sm: 0 2px 10px rgba(45, 110, 97, .06);
  --shadow: 0 8px 26px rgba(45, 110, 97, .10);
  --shadow-lg: 0 18px 48px rgba(45, 110, 97, .16);

  --sidebar-w: 236px;
  --font: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC",
    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: "SF Mono", "JetBrains Mono", "Roboto Mono", Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {
  font-family: var(--font);
  color: var(--ink);
  background: linear-gradient(160deg, #F0FAF7 0%, #F4F9FF 42%, #FFF6F1 100%);
  background-attachment: fixed;
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

#particles {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}

button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }
a { color: var(--primary-dark); text-decoration: none; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: #D3E6E1; border-radius: 8px; }
::-webkit-scrollbar-track { background: transparent; }

/* ---------------------------------------------------------------- 布局 */
.app-shell {
  position: relative;
  z-index: 1;
  display: flex;
  min-height: 100vh;
}

.sidebar {
  flex: 0 0 var(--sidebar-w);
  width: var(--sidebar-w);
  position: sticky;
  top: 0;
  height: 100vh;
  padding: 26px 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  background: rgba(255, 255, 255, .72);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-right: 1px solid var(--line);
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 0 8px 22px;
}
.brand-logo {
  width: 40px; height: 40px;
  border-radius: 13px;
  background: linear-gradient(135deg, var(--primary) 0%, #6FD8BE 55%, var(--secondary) 130%);
  display: grid; place-items: center;
  color: #fff;
  box-shadow: 0 6px 16px rgba(63, 191, 160, .34);
  flex: 0 0 auto;
}
.brand-title { font-size: 16px; font-weight: 700; letter-spacing: .3px; line-height: 1.25; }
.brand-sub { font-size: 11px; color: var(--muted); letter-spacing: 1.2px; text-transform: uppercase; }

.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 14px;
  border-radius: 13px;
  color: var(--ink-2);
  font-weight: 500;
  transition: background .22s, color .22s, transform .22s;
  position: relative;
}
.nav-item svg { flex: 0 0 auto; opacity: .78; transition: opacity .22s; }
.nav-item:hover { background: var(--primary-soft-2); color: var(--primary-dark); transform: translateX(2px); }
.nav-item.active {
  background: linear-gradient(100deg, var(--primary-soft), #EAF7FF);
  color: var(--primary-dark);
  font-weight: 600;
}
.nav-item.active svg { opacity: 1; }
.nav-item.active::before {
  content: "";
  position: absolute; left: 4px; top: 50%;
  width: 3px; height: 18px; margin-top: -9px;
  border-radius: 3px;
  background: var(--primary);
}
.nav-badge {
  margin-left: auto;
  min-width: 20px; height: 20px;
  padding: 0 6px;
  border-radius: 10px;
  background: var(--secondary);
  color: #fff;
  font-size: 11px; font-weight: 700;
  display: grid; place-items: center;
}
.sidebar-foot {
  margin-top: auto;
  padding: 14px 12px 0;
  border-top: 1px dashed var(--line);
  font-size: 11.5px;
  color: var(--muted);
  line-height: 1.75;
}

.main { flex: 1 1 auto; min-width: 0; padding: 26px 30px 48px; }
.container { max-width: 1140px; margin: 0 auto; }

.topbar {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 20px;
}
.topbar h1 { margin: 0; font-size: 23px; font-weight: 700; letter-spacing: .2px; }
.topbar .sub { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
.topbar-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* --------------------------------------------------------- 视图与动画 */
.view { display: none; }
.view.active { display: block; animation: viewIn .44s cubic-bezier(.22, .68, .36, 1) both; }

@keyframes viewIn {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: none; }
}
@keyframes riseIn {
  from { opacity: 0; transform: translateY(14px) scale(.985); }
  to { opacity: 1; transform: none; }
}
@keyframes popIn {
  from { opacity: 0; transform: translateY(12px) scale(.96); }
  to { opacity: 1; transform: none; }
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes toastIn {
  from { opacity: 0; transform: translateY(-14px) scale(.96); }
  to { opacity: 1; transform: none; }
}
@keyframes pulseSoft {
  0%, 100% { box-shadow: 0 0 0 0 rgba(63, 191, 160, .34); }
  70% { box-shadow: 0 0 0 12px rgba(63, 191, 160, 0); }
}
@keyframes growBar { from { transform: scaleX(0); } to { transform: scaleX(1); } }

.rise { animation: riseIn .5s cubic-bezier(.22, .68, .36, 1) both; animation-delay: var(--d, 0s); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001s !important; transition-duration: .001s !important; }
}

/* ------------------------------------------------------------- 卡片 */
.card {
  background: rgba(255, 255, 255, .88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 20px;
  box-shadow: var(--shadow-sm);
  transition: box-shadow .26s, transform .26s;
}
.card.hoverable:hover { box-shadow: var(--shadow); transform: translateY(-2px); }

.card-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; margin-bottom: 14px;
}
.card-title { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.card-title .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); }
.card-title .dot.sec { background: var(--secondary); }
.card-desc { font-size: 12px; color: var(--muted); }

.grid { display: grid; gap: 16px; }
.grid-kpi { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.mb-16 { margin-bottom: 16px; }
.mt-16 { margin-top: 16px; }

/* KPI */
.kpi { position: relative; overflow: hidden; }
.kpi-label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.kpi-value { font-size: 27px; font-weight: 700; letter-spacing: -.4px; margin-top: 6px; font-variant-numeric: tabular-nums; }
.kpi-value small { font-size: 13px; font-weight: 600; color: var(--muted); margin-left: 3px; }
.kpi-foot { font-size: 11.5px; color: var(--muted); margin-top: 5px; }
.kpi-icon {
  position: absolute; right: 14px; top: 14px;
  width: 36px; height: 36px; border-radius: 12px;
  display: grid; place-items: center;
}
.i-mint { background: var(--primary-soft); color: var(--primary-dark); }
.i-coral { background: var(--secondary-soft); color: var(--secondary-ink); }
.i-sky { background: var(--accent-soft); color: var(--accent-ink); }
.i-violet { background: var(--violet-soft); color: #7C5EC0; }
.i-amber { background: var(--amber-soft); color: #C68A1E; }

/* ------------------------------------------------------------ 按钮 */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 9px 16px;
  border-radius: 11px;
  font-size: 13px; font-weight: 600;
  background: #fff;
  color: var(--ink-2);
  border: 1px solid var(--line);
  transition: transform .16s, box-shadow .2s, background .2s, color .2s, border-color .2s;
  white-space: nowrap;
}
.btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-sm); color: var(--primary-dark); border-color: #CDE9E2; }
.btn:active { transform: translateY(0) scale(.985); }
.btn-primary {
  background: linear-gradient(120deg, var(--primary) 0%, #55CFB2 100%);
  color: #fff; border-color: transparent;
  box-shadow: 0 6px 16px rgba(63, 191, 160, .28);
}
.btn-primary:hover { color: #fff; box-shadow: 0 10px 22px rgba(63, 191, 160, .34); }
.btn-secondary {
  background: linear-gradient(120deg, var(--secondary) 0%, #FFB295 100%);
  color: #fff; border-color: transparent;
  box-shadow: 0 6px 16px rgba(255, 158, 122, .3);
}
.btn-secondary:hover { color: #fff; box-shadow: 0 10px 22px rgba(255, 158, 122, .36); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn-ghost:hover { background: var(--primary-soft-2); }
.btn-sm { padding: 6px 11px; font-size: 12px; border-radius: 9px; }
.btn-block { width: 100%; }
.btn-danger:hover { color: #D9534F; border-color: #F6D6D4; background: #FFF6F5; }
.btn[disabled] { opacity: .5; pointer-events: none; }

.chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  padding: 6px 13px; border-radius: 999px;
  background: #fff; border: 1px solid var(--line);
  font-size: 12.5px; color: var(--ink-2);
  transition: all .2s;
}
.chip:hover { border-color: var(--primary); color: var(--primary-dark); }
.chip.active {
  background: var(--primary); color: #fff; border-color: transparent;
  box-shadow: 0 4px 12px rgba(63, 191, 160, .26);
}

/* ------------------------------------------------------------- 表单 */
.form-row { margin-bottom: 14px; }
.form-row.tight { margin-bottom: 10px; }
label.lbl {
  display: block; font-size: 12.5px; font-weight: 600;
  color: var(--ink-2); margin-bottom: 6px;
}
label.lbl .req { color: var(--secondary-ink); margin-left: 2px; }
.input, .select, .textarea {
  width: 100%;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  background: #FCFEFD;
  transition: border-color .2s, box-shadow .2s, background .2s;
  outline: none;
}
.input:focus, .select:focus, .textarea:focus {
  border-color: var(--primary);
  background: #fff;
  box-shadow: 0 0 0 3px rgba(63, 191, 160, .14);
}
.textarea { resize: vertical; min-height: 68px; line-height: 1.6; }
.select {
  appearance: none;
  background-image: url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%238AA3AB' stroke-width='2.2' stroke-linecap='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: right 10px center;
  padding-right: 32px;
}
.field-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.hint { font-size: 11.5px; color: var(--muted); margin-top: 5px; }

/* 时间输入：开始=主色 / 结束=副色 */
.time-field input { font-variant-numeric: tabular-nums; font-weight: 600; }
.time-field.start input { color: var(--primary-dark); border-color: #CBE9E1; background: var(--primary-soft-2); }
.time-field.start input:focus { box-shadow: 0 0 0 3px rgba(63, 191, 160, .16); }
.time-field.end input { color: var(--secondary-ink); border-color: #FBDACC; background: #FFF9F6; }
.time-field.end input:focus { border-color: var(--secondary); box-shadow: 0 0 0 3px rgba(255, 158, 122, .18); }

/* 星期选择 */
.week-picker { display: flex; gap: 6px; flex-wrap: wrap; }
.week-picker button {
  width: 38px; height: 34px;
  border-radius: 9px;
  border: 1px solid var(--line);
  background: #fff;
  font-size: 12.5px; color: var(--ink-2);
  transition: all .18s;
}
.week-picker button:hover { border-color: var(--primary); }
.week-picker button.on {
  background: var(--primary); border-color: transparent; color: #fff; font-weight: 600;
  box-shadow: 0 4px 10px rgba(63, 191, 160, .26);
}

/* 分段控件 */
.segmented {
  display: inline-flex;
  padding: 3px;
  gap: 2px;
  background: var(--line-2);
  border-radius: 12px;
  flex-wrap: wrap;
}
.segmented button {
  padding: 7px 14px;
  border-radius: 9px;
  font-size: 12.5px; font-weight: 600;
  color: var(--muted);
  transition: all .2s;
}
.segmented button.active { background: #fff; color: var(--primary-dark); box-shadow: var(--shadow-sm); }

/* 掌握程度选择 */
.mastery-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.mastery-grid button {
  padding: 11px 4px 9px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: #fff;
  text-align: center;
  transition: all .2s;
}
.mastery-grid button .m-emoji { font-size: 19px; display: block; line-height: 1.2; }
.mastery-grid button .m-text { font-size: 11.5px; color: var(--muted); margin-top: 2px; display: block; }
.mastery-grid button:hover { transform: translateY(-2px); border-color: var(--primary); }
.mastery-grid button.on {
  border-color: transparent;
  background: linear-gradient(140deg, var(--primary-soft), #E9F5FF);
  box-shadow: 0 6px 16px rgba(63, 191, 160, .2);
}
.mastery-grid button.on .m-text { color: var(--primary-dark); font-weight: 700; }

/* -------------------------------------------------------- 计划 / 任务 */
.plan-layout { display: grid; grid-template-columns: 372px minmax(0, 1fr); gap: 18px; align-items: start; }
.plan-form-wrap { position: sticky; top: 22px; }

.plan-item {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px 15px;
  background: #fff;
  margin-bottom: 12px;
  transition: box-shadow .24s, transform .24s, border-color .24s;
  position: relative;
  overflow: hidden;
}
.plan-item::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
  background: linear-gradient(180deg, var(--primary), var(--secondary));
  opacity: .85;
}
.plan-item:hover { box-shadow: var(--shadow); transform: translateY(-2px); }
.plan-item.done { background: var(--primary-soft-2); }
.plan-item-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.plan-task { font-size: 14.5px; font-weight: 650; line-height: 1.45; }
.plan-item.done .plan-task { text-decoration: line-through; text-decoration-color: rgba(63,191,160,.6); color: var(--ink-2); }
.plan-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 9px; }

.tag {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 11.5px; font-weight: 600;
  background: var(--line-2); color: var(--ink-2);
}
.tag-subject { background: var(--accent-soft); color: var(--accent-ink); }
.tag-repeat { background: var(--violet-soft); color: #7C5EC0; }
.tag-done { background: var(--primary-soft); color: var(--primary-dark); }
.tag-pending { background: var(--secondary-soft); color: var(--secondary-ink); }
.tag-running { background: var(--amber-soft); color: #C68A1E; }

.time-chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 10px; border-radius: 8px;
  font-family: var(--mono); font-size: 12px; font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.time-chip.start { color: var(--primary-dark); background: var(--primary-soft); }
.time-chip.end { color: var(--secondary-ink); background: var(--secondary-soft); }
.time-arrow { color: var(--muted); font-size: 12px; }

.plan-note, .plan-focus {
  margin-top: 10px;
  font-size: 12.5px;
  color: var(--ink-2);
  background: #FAFDFC;
  border: 1px dashed var(--line);
  border-radius: var(--radius-sm);
  padding: 8px 11px;
  line-height: 1.6;
}
.plan-focus { border-style: solid; border-color: #DCF0EA; background: linear-gradient(100deg, var(--primary-soft-2), #F6FBFF); }
.plan-focus .fl { font-weight: 700; color: var(--primary-dark); margin-right: 4px; }
.plan-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }

/* 打卡卡片 */
.checkin-card { position: relative; }
.checkin-card.active-timer { border-color: var(--primary); box-shadow: 0 10px 30px rgba(63, 191, 160, .2); }
.timer-box {
  display: flex; align-items: center; justify-content: space-between;
  gap: 14px; flex-wrap: wrap;
  margin-top: 12px; padding: 12px 14px;
  border-radius: var(--radius);
  background: linear-gradient(105deg, var(--primary-soft), #EAF4FF);
}
.timer-value {
  font-family: var(--mono); font-size: 26px; font-weight: 700;
  letter-spacing: 1px; color: var(--primary-dark);
  font-variant-numeric: tabular-nums;
}
.timer-hint { font-size: 11.5px; color: var(--muted); }
.timer-actions { display: flex; gap: 8px; }
.dot-live {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--primary); display: inline-block;
  animation: pulseSoft 1.8s infinite;
}
.dot-live.paused { background: var(--amber); animation: none; }

/* 进度环 */
.ring-wrap { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.ring { position: relative; width: 116px; height: 116px; flex: 0 0 auto; }
.ring svg { transform: rotate(-90deg); }
.ring .ring-bg { stroke: var(--line-2); }
.ring .ring-fg { stroke: url(#ringGrad); stroke-linecap: round; transition: stroke-dashoffset 1s cubic-bezier(.22,.68,.36,1); }
.ring-center {
  position: absolute; inset: 0;
  display: grid; place-items: center; text-align: center;
}
.ring-center b { font-size: 22px; letter-spacing: -.5px; }
.ring-center span { font-size: 11px; color: var(--muted); display: block; }

/* 进度条 */
.bar-line { display: flex; align-items: center; gap: 10px; margin-bottom: 11px; }
.bar-name { width: 80px; flex: 0 0 auto; font-size: 12.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-track { flex: 1 1 auto; height: 9px; border-radius: 999px; background: var(--line-2); overflow: hidden; }
.bar-fill {
  height: 100%; border-radius: 999px;
  transform-origin: left center;
  animation: growBar .8s cubic-bezier(.22,.68,.36,1) both;
  animation-delay: var(--d, 0s);
}
.bar-val { width: 62px; text-align: right; flex: 0 0 auto; font-size: 12px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }

/* ------------------------------------------------------------ 图表 */
.chart-box { position: relative; width: 100%; height: 260px; }
.chart-box.tall { height: 300px; }
.chart-empty {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  color: var(--muted); font-size: 12.5px;
}

/* ------------------------------------------------------------ 表格 */
.table-wrap { overflow-x: auto; border-radius: var(--radius); border: 1px solid var(--line); background: #fff; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 780px; }
table.tbl th {
  text-align: left; padding: 11px 13px;
  background: var(--primary-soft-2);
  color: var(--ink-2); font-size: 12px; font-weight: 700;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
  position: sticky; top: 0; z-index: 1;
}
table.tbl td { padding: 11px 13px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
table.tbl tbody tr { transition: background .18s; }
table.tbl tbody tr:hover { background: #FAFEFD; }
table.tbl tbody tr:last-child td { border-bottom: none; }
.td-mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.td-dim { color: var(--muted); }
.cell-note { max-width: 240px; white-space: pre-wrap; word-break: break-word; }

.filter-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; align-items: end; }

/* 空状态 */
.empty {
  text-align: center; padding: 40px 18px; color: var(--muted);
}
.empty .e-emoji { font-size: 34px; display: block; margin-bottom: 10px; opacity: .9; }
.empty .e-title { font-size: 14px; font-weight: 600; color: var(--ink-2); margin-bottom: 5px; }
.empty .e-desc { font-size: 12.5px; margin-bottom: 14px; }

/* --------------------------------------------------------- 弹窗 / 提示 */
.modal-mask {
  position: fixed; inset: 0; z-index: 60;
  background: rgba(38, 62, 68, .3);
  backdrop-filter: blur(3px);
  display: grid; place-items: center;
  padding: 18px;
  animation: fadeIn .2s both;
  overflow-y: auto;
}
.modal {
  width: 100%; max-width: 460px;
  background: #fff;
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  padding: 22px;
  animation: popIn .3s cubic-bezier(.22,.68,.36,1) both;
  max-height: calc(100vh - 36px);
  overflow-y: auto;
}
.modal-title { font-size: 16.5px; font-weight: 700; margin-bottom: 4px; }
.modal-sub { font-size: 12.5px; color: var(--muted); margin-bottom: 16px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 9px; margin-top: 18px; }

#toast-root {
  position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
  z-index: 90; display: flex; flex-direction: column; gap: 8px; align-items: center;
  pointer-events: none;
}
.toast {
  padding: 10px 18px;
  border-radius: 999px;
  background: rgba(43, 66, 73, .92);
  color: #fff;
  font-size: 13px; font-weight: 500;
  box-shadow: var(--shadow);
  animation: toastIn .26s cubic-bezier(.22,.68,.36,1) both;
  display: flex; align-items: center; gap: 8px;
}
.toast.ok { background: linear-gradient(120deg, var(--primary-dark), var(--primary)); }
.toast.warn { background: linear-gradient(120deg, var(--secondary-ink), var(--secondary)); }

/* --------------------------------------------------------- 移动端 Tab */
.tabbar {
  display: none;
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
  background: rgba(255, 255, 255, .93);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid var(--line);
  padding: 7px 4px calc(7px + env(safe-area-inset-bottom));
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.tabbar::-webkit-scrollbar { display: none; }
.tabbar .tab-item {
  flex: 1 1 0; min-width: 0;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 4px 2px;
  color: var(--muted);
  font-size: 10.5px;
  transition: color .2s, transform .2s;
  border-radius: 12px;
  white-space: nowrap;
}
.tabbar .tab-item.active { color: var(--primary-dark); font-weight: 700; }
.tabbar .tab-item.active svg { transform: translateY(-1px) scale(1.06); }
.tabbar .tab-item svg { transition: transform .22s; }
.mobile-brand { display: none; }

@media (max-width: 980px) {
  .plan-layout { grid-template-columns: 1fr; }
  .plan-form-wrap { position: static; }
  .grid-3 { grid-template-columns: 1fr; }
}

@media (max-width: 860px) {
  .sidebar { display: none; }
  .tabbar { display: flex; }
  .main { padding: 16px 14px calc(84px + env(safe-area-inset-bottom)); }
  .topbar { flex-direction: column; align-items: stretch; gap: 12px; }
  .topbar h1 { font-size: 20px; }
  .grid-2 { grid-template-columns: 1fr; }
  .grid.grid-2 { grid-template-columns: 1fr !important; }
  .home-top-grid { grid-template-columns: 1fr !important; }
  .ring-wrap { flex-direction: column; align-items: flex-start; }
  .ring-wrap .ring { align-self: flex-start; }
  .card { padding: 16px; border-radius: var(--radius); }
  .kpi-value { font-size: 23px; }
  .field-2 { grid-template-columns: 1fr; }
  .mobile-brand {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 4px;
  }
  .chart-box { height: 230px; }
  .mastery-grid { grid-template-columns: repeat(5, 1fr); gap: 5px; }
  .mastery-grid button { padding: 9px 2px 7px; }
  .mastery-grid button .m-text { font-size: 10px; }

  /* 表格 → 卡片 */
  table.tbl { min-width: 0; }
  .table-wrap { border: none; background: transparent; overflow: visible; }
  table.tbl thead { display: none; }
  table.tbl tbody tr {
    display: block;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 10px;
    box-shadow: var(--shadow-sm);
  }
  table.tbl td {
    display: flex; justify-content: space-between; gap: 14px;
    padding: 4px 0; border: none; text-align: right;
  }
  table.tbl td::before {
    content: attr(data-label);
    font-size: 12px; color: var(--muted); font-weight: 600;
    text-align: left; flex: 0 0 auto;
  }
  .cell-note { max-width: none; text-align: right; }
}

@media (max-width: 420px) {
  .timer-value { font-size: 22px; }
  .btn { padding: 8px 13px; }
  .tabbar .tab-item { font-size: 9px; padding: 4px 0; width: 20%; max-width: 20%; }
  .tabbar .tab-item svg { width: 17px; height: 17px; }
}

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}

/* ==========================================================================
   云同步模块样式
   ========================================================================== */
.sync-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 11px; border-radius: 999px;
  border: 1px solid var(--line);
  background: #fff; color: var(--ink-2);
  font-size: 12.5px; font-weight: 600; cursor: pointer;
  transition: background .2s, border-color .2s, transform .12s, box-shadow .2s;
  white-space: nowrap;
}
.sync-pill:hover { transform: translateY(-1px); box-shadow: var(--shadow-sm); }
.sync-pill .dot-sync {
  width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto;
  background: var(--muted); transition: background .2s;
}
.sync-pill.sync-ok { border-color: var(--primary); color: var(--primary-dark); }
.sync-pill.sync-ok .dot-sync { background: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.sync-pill.sync-idle,
.sync-pill.sync-locked { border-color: var(--line); color: var(--muted); }
.sync-pill.sync-locked .dot-sync { background: var(--amber); }
.sync-pill.sync-syncing { border-color: var(--accent); color: var(--accent-ink); }
.sync-pill.sync-syncing .dot-sync { background: var(--accent); animation: pulse 1s infinite; }
.sync-pill.sync-error { border-color: var(--secondary); color: var(--secondary-ink); }
.sync-pill.sync-error .dot-sync { background: var(--secondary); }
.sync-pill .spin { display: inline-flex; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

/* 开关 */
.switch {
  position: relative;
  display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
  font-size: 13px; font-weight: 600; color: var(--muted); user-select: none;
}
.switch::before {
  content: ""; width: 34px; height: 19px; border-radius: 999px;
  background: var(--line); transition: background .2s; flex: 0 0 auto;
}
.switch::after {
  content: ""; position: absolute; left: 2px; top: calc(50% - 7.5px);
  width: 15px; height: 15px; border-radius: 50%;
  background: #fff; box-shadow: var(--shadow-sm); transition: left .2s;
}
.switch.on { color: var(--primary-dark); }
.switch.on::before { background: var(--primary); }
.switch.on::after { left: 17px; }

/* 弹窗内键值 */
.kv {
  display: flex; justify-content: space-between; gap: 12px;
  padding: 8px 0; border-bottom: 1px dashed var(--line-2); font-size: 13px;
}
.kv:last-of-type { border-bottom: none; }
.kv span { color: var(--muted); }
.kv b { color: var(--ink); font-weight: 600; word-break: break-all; text-align: right; }

</style>

  'use strict';

    { v: 1, emoji: '🌱', text: '生疏' },

    '编程', '专业课', '阅读', '写作', '复盘', '其他'];
  var PALETTE = ['#3FBFA0', '#FF9E7A', '#7FB3F5', '#B39BE8', '#F7C56B',

  var TIPS = [
    '把大目标切成 25 分钟的小块，专注会容易很多。',

  var NAV = [

    { key: 'plan', label: '计划', icon: 'ic-plan', title: '每日计划', sub: '维护计划模板，填写今日学习具体项目' },
    { key: 'dashboard', label: '看板', icon: 'ic-chart', title: '数据看板', sub: '科目分布、时长趋势与掌握程度统计' },
    { key: 'history', label: '历史', icon: 'ic-history', title: '历史记录', sub: '完整打卡明细，支持筛选与 CSV 导出' }

  function fmtDateFull(key) {

  }

    var t = today();

    if (type === 'weekly' && !days.length) days = [weekdayOf(today())];
    var since = /^\d{4}-\d{2}-\d{2}$/.test(rep.since) ? rep.since : null;
    var onDate = /^\d{4}-\d{2}-\d{2}$/.test(rep.date) ? rep.date : null;
    var created = Number(p.createdAt) || Date.now();
    if (!since) since = onDate || dateKey(new Date(created));
    var task = asText(p.task, 400).trim();
    if (!task) return null;
    return {
      id: asText(p.id) || uid('plan'),
      subject: asText(p.subject, 40).trim() || '未分类',
      task: task,
      startTime: isTimeStr(p.startTime) ? p.startTime : '20:00',
      endTime: isTimeStr(p.endTime) ? p.endTime : '21:00',
      repeat: { type: type, date: onDate || since, since: since, weekdays: days },
      note: asText(p.note, 600),
      createdAt: created,
      updatedAt: Number(p.updatedAt) || created
    };
  }

  function sanitizeRecord(r) {
    r = asObject(r);
    var date = /^\d{4}-\d{2}-\d{2}$/.test(r.date) ? r.date : null;
    if (!date) return null;
    return {
      id: asText(r.id) || uid('rec'),
      date: date,
      planId: asText(r.planId),
      subject: asText(r.subject, 40) || '未分类',
      task: asText(r.task, 400) || '（无描述）',
      focus: asText(r.focus, 600),
      planStart: isTimeStr(r.planStart) ? r.planStart : '',
      planEnd: isTimeStr(r.planEnd) ? r.planEnd : '',
      startedAt: Number(r.startedAt) || 0,
      endedAt: Number(r.endedAt) || 0,
      durationSec: Math.max(0, Math.round(Number(r.durationSec) || 0)),
      mastery: clamp(Math.round(Number(r.mastery) || 3), 1, 5),
      note: asText(r.note, 1000),
      createdAt: Number(r.createdAt) || Date.now()
    };
  }

  function sanitizeDay(d, key) {
    d = asObject(d);
    var focus = asObject(d.focus), clean = {};
    Object.keys(focus).forEach(function (k) { clean[k] = asText(focus[k], 600); });
    return {
      date: key,
      focus: clean,
      createdAt: Number(d.createdAt) || Date.now()
    };
  }

  function sanitizeTimer(t) {
    t = asObject(t);
    if (!t.planId || !/^\d{4}-\d{2}-\d{2}$/.test(t.date)) return null;
    return {
      planId: asText(t.planId),
      date: t.date,
      startedAt: Number(t.startedAt) || Date.now(),
      firstStartedAt: Number(t.firstStartedAt) || Number(t.startedAt) || Date.now(),
      accSec: Math.max(0, Math.round(Number(t.accSec) || 0)),
      running: !!t.running
    };
  }

  /** 版本迁移：v1 (dailyFocus 平铺) → v2 (days 按日期归档) */
  function migrate(data) {
    var v = Number(data.version) || 1;
    if (v < 2) {
      var days = asObject(data.days);
      var legacy = asObject(data.dailyFocus);
      Object.keys(legacy).forEach(function (k) {
        if (!days[k]) days[k] = { date: k, focus: asObject(legacy[k]), createdAt: Date.now() };
      });
      data.days = days;
      delete data.dailyFocus;
      data.version = 2;
    }
    if (Number(data.version) > SCHEMA_VERSION) {
      // 更高版本（可能来自新版页面）：保守读取，不破坏原数据
      data.meta = asObject(data.meta);
      data.meta.notice = '检测到更高版本的数据，已按兼容模式读取。';
    }
    return data;
  }

  function normalize(raw) {
    var data = asObject(raw);
    data = migrate(data);
    var store = defaultStore();
    store.version = SCHEMA_VERSION;
    store.createdAt = Number(data.createdAt) || Date.now();
    store.meta = asObject(data.meta);

    store.plans = asArray(data.plans).map(sanitizePlan).filter(Boolean);
    store.records = asArray(data.records).map(sanitizeRecord).filter(Boolean)
      .sort(function (a, b) { return (b.endedAt || b.createdAt) - (a.endedAt || a.createdAt); });

    var days = asObject(data.days);
    store.days = {};
    Object.keys(days).forEach(function (k) {
      if (/^\d{4}-\d{2}-\d{2}$/.test(k)) store.days[k] = sanitizeDay(days[k], k);
    });
    store.timer = sanitizeTimer(data.timer);
    var tombs = asObject(data.tombstones);
    store.tombstones = {
      plans: tombMap(tombs.plans),
      records: tombMap(tombs.records)
    };
    return store;
  }

  var pendingNotice = '';

  function loadStore() {
    if (!storageOK) {
      pendingNotice = '当前浏览器禁用了本地存储，数据无法保存。';
      return defaultStore();
    }
    var raw = null;
    try { raw = localStorage.getItem(STORE_KEY); } catch (e) { raw = null; }
    if (!raw) return defaultStore();
    var parsed;
    try {
      parsed = JSON.parse(raw);
    } catch (e) {
      try { localStorage.setItem(BROKEN_KEY, raw.slice(0, 200000)); } catch (e2) { }
      pendingNotice = '本地数据损坏，已备份并重新初始化。';
      return defaultStore();
    }
    try {
      return normalize(parsed);
    } catch (e) {
      try { localStorage.setItem(BROKEN_KEY, raw.slice(0, 200000)); } catch (e3) { }
      pendingNotice = '数据结构异常，已备份并重新初始化。';
      return defaultStore();
    }
  }

  var store = loadStore();

  function saveStore() {
    store.version = SCHEMA_VERSION;
    store.updatedAt = Date.now();
    if (!storageOK) return false;
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(store));
      return true;
    } catch (e) {
      App.toast('保存失败：本地存储空间不足或被限制', 'warn');
      return false;
    }
  }

  /* --------------------------------------------------- 业务查询与操作 */
  function ensureDay(key) {
    if (!store.days[key]) store.days[key] = { date: key, focus: {}, createdAt: Date.now() };
    return store.days[key];
  }
  function focusOf(key, planId) {
    var d = store.days[key];
    return (d && d.focus && d.focus[planId]) ? d.focus[planId] : '';
  }
  function setFocus(key, planId, text) {
    var d = ensureDay(key);
    text = asText(text, 600).trim();
    if (text) d.focus[planId] = text; else delete d.focus[planId];
    saveStore();
  }

  /** 记录删除墓碑：同步时据此在云端传播删除，避免被旧数据复活 */
  function markDeleted(kind, id) {
    if (!store.tombstones) store.tombstones = { plans: {}, records: {} };
    if (!store.tombstones[kind]) store.tombstones[kind] = {};
    store.tombstones[kind][id] = Date.now();
  }

  function planAppliesTo(plan, key) {
    if (!plan) return false;
    var since = plan.repeat.since || dateKey(new Date(plan.createdAt));
    if (plan.repeat.type === 'once') return plan.repeat.date === key;
    if (key < since) return false;
    if (plan.repeat.type === 'daily') return true;
    if (plan.repeat.type === 'weekly') return plan.repeat.weekdays.indexOf(weekdayOf(key)) >= 0;
    return false;
  }

  function plansOfDay(key) {
    return store.plans.filter(function (p) { return planAppliesTo(p, key); })
      .sort(function (a, b) { return timeToMin(a.startTime) - timeToMin(b.startTime); });
  }
  function planById(id) {
    for (var i = 0; i < store.plans.length; i++) if (store.plans[i].id === id) return store.plans[i];
    return null;
  }
  function recordsOfDay(key) {
    return store.records.filter(function (r) { return r.date === key; });
  }
  function recordsOfTask(key, planId) {
    return store.records.filter(function (r) { return r.date === key && r.planId === planId; });
  }
  function durationOfTask(key, planId) {
    return recordsOfTask(key, planId).reduce(function (s, r) { return s + r.durationSec; }, 0);
  }
  function isTaskDone(key, planId) { return recordsOfTask(key, planId).length > 0; }
  function totalDuration(list) {
    return list.reduce(function (s, r) { return s + r.durationSec; }, 0);
  }
  function subjectsAll() {
    var set = {};
    store.plans.forEach(function (p) { set[p.subject] = 1; });
    store.records.forEach(function (r) { set[r.subject] = 1; });
    return Object.keys(set).sort();
  }
  function repeatLabel(plan) {
    var t = plan.repeat.type;
    if (t === 'daily') return '每天';
    if (t === 'weekly') {
      return '每周' + plan.repeat.weekdays.map(function (d) { return WEEK_CN[d]; }).join('·');
    }
    return '单次 ' + fmtDateCN(plan.repeat.date, false);
  }
  function streakDays() {
    var set = {};
    store.records.forEach(function (r) { set[r.date] = 1; });
    var cur = today();
    if (!set[cur]) {
      cur = shiftDays(cur, -1);
      if (!set[cur]) return 0;
    }
    var n = 0;
    while (set[cur]) { n++; cur = shiftDays(cur, -1); }
    return n;
  }
  function weekStart(key) {
    var d = parseKey(key);
    var wd = (d.getDay() + 6) % 7; // 周一为起点
    d.setDate(d.getDate() - wd);
    return dateKey(d);
  }

  /* ---------------------------------------------------- 计时器逻辑 */
  var timerTick = null;

  function timerElapsed() {
    var t = store.timer;
    if (!t) return 0;
    var extra = t.running ? (Date.now() - t.startedAt) / 1000 : 0;
    return Math.max(0, Math.floor(t.accSec + extra));
  }
  function startTimer(planId, key) {
    if (store.timer && (store.timer.planId !== planId || store.timer.date !== key)) {
      App.toast('已有任务在计时，请先结束当前任务', 'warn');
      return false;
    }
    if (!store.timer) {
      store.timer = { planId: planId, date: key, startedAt: Date.now(), firstStartedAt: Date.now(), accSec: 0, running: true };
    } else {
      store.timer.startedAt = Date.now();
      store.timer.running = true;
    }
    saveStore();
    App.syncTimerUI();
    return true;
  }
  function pauseTimer() {
    var t = store.timer;
    if (!t || !t.running) return;
    t.accSec = Math.floor(t.accSec + (Date.now() - t.startedAt) / 1000);
    t.running = false;
    saveStore();
    App.syncTimerUI();
  }
  function clearTimer() {
    store.timer = null;
    saveStore();
    App.syncTimerUI();
  }

  /* ------------------------------------------------ 提示 / 弹窗组件 */
  var toastTimers = [];
  function toast(msg, type) {
    var root = $('#toast-root');
    if (!root) return;
    var div = document.createElement('div');
    div.className = 'toast' + (type ? ' ' + type : '');
    div.textContent = msg;
    root.appendChild(div);
    var t = setTimeout(function () {
      div.style.transition = 'opacity .3s, transform .3s';
      div.style.opacity = '0';
      div.style.transform = 'translateY(-10px)';
      setTimeout(function () { if (div.parentNode) div.parentNode.removeChild(div); }, 320);
    }, 2400);
    toastTimers.push(t);
    if (toastTimers.length > 20) toastTimers.shift();
  }

  var activeModalClose = null;
  function openModal(opt) {
    closeModal();
    var root = $('#modal-root');
    var mask = document.createElement('div');
    mask.className = 'modal-mask';
    mask.innerHTML =
      '<div class="modal" role="dialog" aria-modal="true">' +
      '<div class="modal-title">' + esc(opt.title || '') + '</div>' +
      (opt.sub ? '<div class="modal-sub">' + esc(opt.sub) + '</div>' : '') +
      '<div class="modal-body">' + (opt.body || '') + '</div>' +
      '<div class="modal-foot">' + (opt.foot || '') + '</div>' +
      '</div>';
    root.appendChild(mask);
    mask.addEventListener('mousedown', function (e) {
      if (e.target === mask && opt.maskClose !== false) closeModal();
    });
    function onKey(e) {
      if (e.key === 'Escape') closeModal();
    }
    document.addEventListener('keydown', onKey);
    activeModalClose = function () {
      document.removeEventListener('keydown', onKey);
      if (mask.parentNode) mask.parentNode.removeChild(mask);
      activeModalClose = null;
    };
    if (typeof opt.onMount === 'function') opt.onMount(mask);
    var first = mask.querySelector('[data-autofocus]');
    if (first) setTimeout(function () { try { first.focus(); } catch (e) { } }, 60);
    return activeModalClose;
  }
  function closeModal() { if (activeModalClose) activeModalClose(); }

  function confirmModal(opt, onYes) {
    openModal({
      title: opt.title || '确认操作',
      sub: opt.sub || '',
      body: opt.body || '',
      foot: '<button class="btn" data-act="modal-close">取消</button>' +
        '<button class="btn ' + (opt.danger ? 'btn-secondary' : 'btn-primary') + '" data-act="confirm-yes">' +
        esc(opt.okText || '确定') + '</button>',
      onMount: function (mask) {
        mask.querySelector('[data-act="confirm-yes"]').addEventListener('click', function () {
          closeModal();
          onYes();
        });
      }
    });
  }

  /* -------------------------------------------------------- 粒子背景 */
  function initParticles() {
    var canvas = $('#particles');
    if (!canvas || !canvas.getContext) return;
    var ctx = canvas.getContext('2d');
    if (!ctx) return;
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var dots = [], W = 0, H = 0, dpr = 1, raf = null, blobs = [];

    function resize() {
      dpr = Math.min(2, window.devicePixelRatio || 1);
      W = canvas.clientWidth || window.innerWidth;
      H = canvas.clientHeight || window.innerHeight;
      canvas.width = Math.floor(W * dpr);
      canvas.height = Math.floor(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      var target = clamp(Math.round(W * H / 26000), 22, 64);
      dots = [];
      for (var i = 0; i < target; i++) {
        dots.push({
          x: Math.random() * W,
          y: Math.random() * H,
          vx: (Math.random() - 0.5) * 0.22,
          vy: (Math.random() - 0.5) * 0.22,
          r: 1.1 + Math.random() * 2.2,
          c: ['#3FBFA0', '#7FB3F5', '#FF9E7A', '#B39BE8'][i % 4],
          a: 0.18 + Math.random() * 0.3
        });
      }
      blobs = [
        { x: W * 0.16, y: H * 0.18, r: Math.max(W, H) * 0.22, c: 'rgba(63,191,160,0.10)' },
        { x: W * 0.86, y: H * 0.24, r: Math.max(W, H) * 0.2, c: 'rgba(127,179,245,0.10)' },
        { x: W * 0.7, y: H * 0.85, r: Math.max(W, H) * 0.22, c: 'rgba(255,158,122,0.09)' }
      ];
    }

    function paint() {
      ctx.clearRect(0, 0, W, H);
      blobs.forEach(function (b) {
        var g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
        g.addColorStop(0, b.c);
        g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
      });
      for (var i = 0; i < dots.length; i++) {
        var p = dots[i];
        for (var j = i + 1; j < dots.length; j++) {
          var q = dots[j], dx = p.x - q.x, dy = p.y - q.y, d2 = dx * dx + dy * dy;
          if (d2 < 15000) {
            ctx.strokeStyle = 'rgba(63,191,160,' + (0.1 * (1 - d2 / 15000)).toFixed(3) + ')';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(q.x, q.y);
            ctx.stroke();
          }
        }
        ctx.globalAlpha = p.a;
        ctx.fillStyle = p.c;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    function step() {
      for (var i = 0; i < dots.length; i++) {
        var p = dots[i];
        p.x += p.vx; p.y += p.vy;
        if (p.x < -10) p.x = W + 10; else if (p.x > W + 10) p.x = -10;
        if (p.y < -10) p.y = H + 10; else if (p.y > H + 10) p.y = -10;
      }
      paint();
      raf = requestAnimationFrame(step);
    }

    resize();
    if (reduce) { paint(); } else { step(); }

    var rt = null;
    window.addEventListener('resize', function () {
      clearTimeout(rt);
      rt = setTimeout(function () { resize(); if (reduce) paint(); }, 180);
    });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) {
        if (raf) { cancelAnimationFrame(raf); raf = null; }
      } else if (!reduce && !raf) { step(); }
    });
  }

  /* ------------------------------------------------------------ 路由 */
  var ui = {
    route: 'home',
    dashRange: 30,
    planFilter: 'all',
    historyTab: 'records',
    form: null,
    filters: { from: '', to: '', subject: '', mastery: '', kw: '' }
  };

  function renderNav() {
    var side = $('#side-nav'), tab = $('#tabbar');
    var todayTasks = plansOfDay(today());
    var pending = todayTasks.filter(function (p) { return !isTaskDone(today(), p.id); }).length;

    side.innerHTML = NAV.map(function (n) {
      return '<a class="nav-item' + (ui.route === n.key ? ' active' : '') + '" href="#/' + n.key + '">' +
        '<svg width="19" height="19" viewBox="0 0 24 24"><use href="#' + n.icon + '"/></svg>' +
        '<span>' + n.label + '</span>' +
        (n.key === 'checkin' && pending ? '<span class="nav-badge">' + pending + '</span>' : '') +
        '</a>';
    }).join('');

    tab.innerHTML = NAV.map(function (n) {
      return '<a class="tab-item' + (ui.route === n.key ? ' active' : '') + '" href="#/' + n.key + '">' +
        '<svg width="21" height="21" viewBox="0 0 24 24"><use href="#' + n.icon + '"/></svg>' +
        '<span>' + n.label + '</span></a>';
    }).join('');

    var foot = $('#foot-stat');
    if (foot) {
      foot.textContent = '共 ' + store.records.length + ' 次打卡 · ' + fmtDur(totalDuration(store.records));
    }
  }

  function currentNav() {
    for (var i = 0; i < NAV.length; i++) if (NAV[i].key === ui.route) return NAV[i];
    return NAV[0];
  }

  function navigate() {
    var hash = (location.hash || '').replace(/^#\/?/, '').split('?')[0] || 'home';
    var known = NAV.some(function (n) { return n.key === hash; });
    ui.route = known ? hash : 'home';

    var nav = currentNav();
    $('#page-title').textContent = nav.title;
    $('#page-sub').textContent = nav.sub;

    $$('.view').forEach(function (v) { v.classList.remove('active'); });
    var view = $('#view-' + ui.route);
    if (view) {
      App.renderView(ui.route, view);
      // 触发入场动画
      void view.offsetWidth;
      view.classList.add('active');
    }
    renderNav();
    App.renderPageActions();
    App.syncTimerUI();
    window.scrollTo({ top: 0, behavior: 'auto' });
  }

  /* ----------------------------------------------- 全局事件委托 */
  var ACTIONS = {};
  document.addEventListener('click', function (e) {
    var node = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!node) return;
    var act = node.getAttribute('data-act');
    if (act === 'modal-close') { e.preventDefault(); closeModal(); return; }
    if (ACTIONS[act]) {
      e.preventDefault();
      ACTIONS[act](node, e);
    }
  });
  document.addEventListener('submit', function (e) {
    var form = e.target.closest ? e.target.closest('[data-submit]') : null;
    if (!form) return;
    var act = form.getAttribute('data-submit');
    if (ACTIONS[act]) {
      e.preventDefault();
      ACTIONS[act](form, e);
    }
  });

  /* -------------------------------------------------------- 对外暴露 */
  var App = {
    // 常量
    STORE_KEY: STORE_KEY, WEEK_CN: WEEK_CN, MASTERY: MASTERY, PALETTE: PALETTE,
    SUBJECT_PRESETS: SUBJECT_PRESETS, TIPS: TIPS, NAV: NAV,
    // 工具
    $: $, $$: $$, esc: esc, uid: uid, clamp: clamp, pad2: pad2, asText: asText,
    dateKey: dateKey, today: today, parseKey: parseKey, shiftDays: shiftDays,
    weekdayOf: weekdayOf, fmtDateCN: fmtDateCN, fmtDateFull: fmtDateFull, relDayLabel: relDayLabel,
    fmtDur: fmtDur, fmtClock: fmtClock, minutesOf: minutesOf, fmtTimeOfDay: fmtTimeOfDay,
    isTimeStr: isTimeStr, timeToMin: timeToMin, masteryInfo: masteryInfo, colorFor: colorFor,
    // 数据
    store: store, save: saveStore, storageOK: storageOK,
    ensureDay: ensureDay, focusOf: focusOf, setFocus: setFocus, markDeleted: markDeleted,
    planAppliesTo: planAppliesTo, plansOfDay: plansOfDay, planById: planById,
    recordsOfDay: recordsOfDay, recordsOfTask: recordsOfTask, durationOfTask: durationOfTask,
    isTaskDone: isTaskDone, totalDuration: totalDuration, subjectsAll: subjectsAll,
    repeatLabel: repeatLabel, streakDays: streakDays, weekStart: weekStart,
    // 计时
    timerElapsed: timerElapsed, startTimer: startTimer, pauseTimer: pauseTimer, clearTimer: clearTimer,
    // UI
    ui: ui, ACTIONS: ACTIONS, toast: toast, openModal: openModal, closeModal: closeModal,
    confirmModal: confirmModal, renderNav: renderNav, navigate: navigate,
    // 由视图层实现
    renderView: function () { }, renderPageActions: function () { }, syncTimerUI: function () { },
    boot: function () {
      initParticles();
      // 跨天遗留计时：自动暂停并提示
      if (store.timer && store.timer.date !== today()) {
        if (store.timer.running) {
          store.timer.accSec = Math.floor(store.timer.accSec + (Date.now() - store.timer.startedAt) / 1000);
          store.timer.running = false;
          saveStore();
        }
        pendingNotice = pendingNotice || '发现跨天未结束的计时，已暂停，请在打卡页确认。';
      }
      ensureDay(today());
      store.meta = asObject(store.meta);
      store.meta.lastOpen = today();
      saveStore();

      window.addEventListener('hashchange', navigate);
      if (!location.hash) location.hash = '#/home';
      navigate();

      if (pendingNotice) toast(pendingNotice, 'warn');
      if (store.meta && store.meta.notice) {
        toast(store.meta.notice, 'warn');
        store.meta.notice = '';
        saveStore();
      }

      // 每秒刷新计时显示
      timerTick = setInterval(function () {
        if (store.timer && store.timer.running) App.syncTimerUI();
      }, 1000);

      // 跨天自动切换（保留历史，生成新的一天）
      var watchDay = today();
      setInterval(function () {
        if (today() !== watchDay) {
          watchDay = today();
          ensureDay(watchDay);
          saveStore();
          toast('新的一天开始了，今日内容已重置', 'ok');
          navigate();
        }
      }, 30000);
    }
  };

  window.App = App;
})();

/* ==========================================================================
   晨露学习打卡 · 视图层
   首页 / 打卡 / 每日计划 / 数据看板 / 历史记录
   ========================================================================== */
(function () {
  'use strict';

  var A = window.App;
  var esc = A.esc, $ = A.$, $$ = A.$$, ui = A.ui, S = A.store, ACT = A.ACTIONS;

  /* ------------------------------------------------------- 片段工具 */
  function ic(id, size) {
    size = size || 18;
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" aria-hidden="true"><use href="#' + id + '"/></svg>';
  }
  function emptyState(o) {
    return '<div class="empty">' +
      '<span class="e-emoji">' + (o.emoji || '🌿') + '</span>' +
      '<div class="e-title">' + esc(o.title || '') + '</div>' +
      '<div class="e-desc">' + esc(o.desc || '') + '</div>' +
      (o.action || '') + '</div>';
  }
  function kpi(o, i) {
    return '<div class="card kpi rise" style="--d:' + (i * 0.05).toFixed(2) + 's">' +
      '<div class="kpi-icon ' + o.tone + '">' + ic(o.icon, 18) + '</div>' +
      '<div class="kpi-label">' + esc(o.label) + '</div>' +
      '<div class="kpi-value">' + o.value + (o.unit ? '<small>' + esc(o.unit) + '</small>' : '') + '</div>' +
      '<div class="kpi-foot">' + esc(o.foot || '') + '</div>' +
      '</div>';
  }
  function ringHTML(pct, label) {
    var r = 50, c = 2 * Math.PI * r, off = c * (1 - A.clamp(pct, 0, 100) / 100);
    return '<div class="ring"><svg width="116" height="116" viewBox="0 0 116 116">' +
      '<circle class="ring-bg" cx="58" cy="58" r="' + r + '" fill="none" stroke-width="10"/>' +
      '<circle class="ring-fg" cx="58" cy="58" r="' + r + '" fill="none" stroke-width="10" ' +
      'stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '"/>' +
      '</svg><div class="ring-center"><b>' + Math.round(pct) + '%</b><span>' + esc(label || '完成度') + '</span></div></div>';
  }
  function timeRangeHTML(start, end) {
    return '<span class="time-chip start">' + ic('ic-clock', 12) + esc(start) + '</span>' +
      '<span class="time-arrow">→</span>' +
      '<span class="time-chip end">' + esc(end) + '</span>';
  }
  function subjectTag(s) { return '<span class="tag tag-subject">' + esc(s) + '</span>'; }
  function masteryTag(v) {
    var m = A.masteryInfo(v);
    return '<span class="tag" style="background:var(--primary-soft);color:var(--primary-dark)">' + m.emoji + ' ' + m.text + '</span>';
  }
  function barLine(name, value, total, color, i) {
    var pct = total > 0 ? (value / total * 100) : 0;
    return '<div class="bar-line">' +
      '<div class="bar-name" title="' + esc(name) + '">' + esc(name) + '</div>' +
      '<div class="bar-track"><div class="bar-fill" style="--d:' + (i * 0.06).toFixed(2) + 's;width:' +
      Math.max(2, pct).toFixed(1) + '%;background:linear-gradient(90deg,' + color + ',' + color + 'cc)"></div></div>' +
      '<div class="bar-val">' + A.fmtDur(value).replace(' 小时', 'h').replace(' 分钟', 'm').replace(' 分', 'm').replace(' 秒', 's') + '</div>' +
      '</div>';
  }

  /* ================================================================
     首页
     ================================================================ */
  function renderHome(root) {
    var t = A.today();
    var plans = A.plansOfDay(t);
    var recs = A.recordsOfDay(t);
    var doneCount = plans.filter(function (p) { return A.isTaskDone(t, p.id); }).length;
    var pct = plans.length ? doneCount / plans.length * 100 : 0;
    var todaySec = A.totalDuration(recs);
    var ws = A.weekStart(t);
    var weekRecs = S.records.filter(function (r) { return r.date >= ws && r.date <= t; });
    var hour = new Date().getHours();
    var greet = hour < 6 ? '夜深了，注意休息' : hour < 11 ? '早上好' : hour < 14 ? '中午好' : hour < 18 ? '下午好' : hour < 23 ? '晚上好' : '夜深了';
    var tip = A.TIPS[A.parseKey(t).getDate() % A.TIPS.length];

    // 近 7 日柱状
    var week = [];
    for (var i = 6; i >= 0; i--) {
      var k = A.shiftDays(t, -i);
      week.push({ key: k, sec: A.totalDuration(A.recordsOfDay(k)) });
    }
    var maxSec = week.reduce(function (m, d) { return Math.max(m, d.sec); }, 0);
    var barsHTML = week.map(function (d, idx) {
      var h = maxSec ? Math.max(6, Math.round(d.sec / maxSec * 104)) : 6;
      var isT = d.key === t;
      var grad = isT ? 'linear-gradient(180deg,#FF9E7A,#FFC0A6)' : 'linear-gradient(180deg,#3FBFA0,#8FDDCB)';
      return '<div style="flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%">' +
        '<div style="font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums">' + (d.sec ? Math.round(d.sec / 60) : '') + '</div>' +
        '<div class="rise" style="--d:' + (idx * 0.06).toFixed(2) + 's;width:100%;max-width:30px;height:' + h + 'px;border-radius:8px 8px 5px 5px;background:' + grad + '"></div>' +
        '<div style="font-size:11px;color:' + (isT ? 'var(--secondary-ink);font-weight:700' : 'var(--muted)') + '">' +
        (isT ? '今天' : '周' + A.WEEK_CN[A.weekdayOf(d.key)]) + '</div></div>';
    }).join('');

    var kpis = [
      { label: '今日学习时长', value: A.minutesOf(todaySec) < 60 ? Math.round(todaySec / 60) : (todaySec / 3600).toFixed(1), unit: A.minutesOf(todaySec) < 60 ? '分钟' : '小时', foot: '共 ' + recs.length + ' 次打卡', icon: 'ic-clock', tone: 'i-mint' },
      { label: '连续打卡', value: A.streakDays(), unit: '天', foot: A.streakDays() > 0 ? '保持住这个节奏' : '今天开个头吧', icon: 'ic-flame', tone: 'i-coral' },
      { label: '本周累计', value: (A.totalDuration(weekRecs) / 3600).toFixed(1), unit: '小时', foot: '本周 ' + weekRecs.length + ' 次打卡', icon: 'ic-trend', tone: 'i-sky' },
      { label: '累计打卡', value: S.records.length, unit: '次', foot: '总时长 ' + A.fmtDur(A.totalDuration(S.records)), icon: 'ic-target', tone: 'i-violet' }
    ];

    var taskPreview = plans.length
      ? plans.slice(0, 5).map(function (p, idx) {
        var done = A.isTaskDone(t, p.id);
        var running = S.timer && S.timer.planId === p.id;
        return '<div class="plan-item rise" style="--d:' + (idx * 0.05).toFixed(2) + 's">' +
          '<div class="plan-item-head"><div class="plan-task">' + esc(p.task) + '</div>' +
          (done ? '<span class="tag tag-done">已完成</span>'
            : running ? '<span class="tag tag-running">计时中</span>'
              : '<span class="tag tag-pending">待打卡</span>') + '</div>' +
          '<div class="plan-meta">' + subjectTag(p.subject) + timeRangeHTML(p.startTime, p.endTime) +
          (A.focusOf(t, p.id) ? '<span class="tag" style="background:var(--primary-soft-2);color:var(--primary-dark)">已填今日项目</span>' : '') +
          '</div></div>';
      }).join('') + (plans.length > 5 ? '<div class="card-desc" style="text-align:center;margin-top:6px">还有 ' + (plans.length - 5) + ' 项，去打卡页查看</div>' : '')
      : emptyState({
        emoji: '🗓️', title: '今天还没有安排', desc: '先去「每日计划」建一条计划，打卡页就会自动出现今日任务。',
        action: '<a class="btn btn-primary" href="#/plan">' + ic('ic-plus', 16) + '新建计划</a>'
      });

    root.innerHTML =
      '<div class="grid grid-2 home-top-grid mb-16" style="grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)">' +
      '<div class="card rise" style="--d:0s">' +
      '<div class="ring-wrap">' + ringHTML(pct, '今日完成') +
      '<div style="flex:1;min-width:180px">' +
      '<div style="font-size:19px;font-weight:700">' + esc(greet) + '，今天是 ' + esc(A.fmtDateCN(t)) + '</div>' +
      '<div class="card-desc" style="margin-top:6px;line-height:1.7">' +
      '今日安排 <b style="color:var(--primary-dark)">' + plans.length + '</b> 项，已完成 <b style="color:var(--primary-dark)">' + doneCount + '</b> 项' +
      (plans.length - doneCount > 0 ? '，还剩 <b style="color:var(--secondary-ink)">' + (plans.length - doneCount) + '</b> 项' : '') +
      '<br>累计专注 <b style="color:var(--primary-dark)">' + A.fmtDur(todaySec) + '</b></div>' +
      '<div class="chip-row" style="margin-top:14px">' +
      '<a class="btn btn-primary btn-sm" href="#/checkin">' + ic('ic-play', 14) + '去打卡</a>' +
      '<a class="btn btn-sm" href="#/plan">' + ic('ic-plan', 14) + '管理计划</a>' +
      '<a class="btn btn-sm" href="#/dashboard">' + ic('ic-chart', 14) + '看数据</a>' +
      '</div></div></div></div>' +
      '<div class="card rise" style="--d:.08s">' +
      '<div class="card-head"><div class="card-title"><span class="dot"></span>近 7 日学习时长</div>' +
      '<span class="card-desc">单位：分钟</span></div>' +
      '<div style="display:flex;align-items:flex-end;gap:8px;height:150px">' + barsHTML + '</div>' +
      '</div></div>' +

      '<div class="grid grid-kpi mb-16">' + kpis.map(kpi).join('') + '</div>' +

      '<div class="grid grid-2">' +
      '<div class="card rise" style="--d:.1s">' +
      '<div class="card-head"><div class="card-title"><span class="dot sec"></span>今日任务</div>' +
      '<a class="btn btn-sm" href="#/checkin">全部</a></div>' + taskPreview + '</div>' +
      '<div class="card rise" style="--d:.16s">' +
      '<div class="card-head"><div class="card-title"><span class="dot"></span>今日学习小语</div></div>' +
      '<div style="padding:14px 16px;border-radius:14px;background:linear-gradient(120deg,var(--primary-soft),#FFF3EC);' +
      'font-size:13.5px;line-height:1.85;color:var(--ink-2)">💡 ' + esc(tip) + '</div>' +
      '<div class="card-head" style="margin:18px 0 12px"><div class="card-title"><span class="dot sec"></span>快捷入口</div></div>' +
      '<div class="chip-row">' +
      '<button class="chip" data-act="quick-add-task">＋ 今日临时任务</button>' +
      '<a class="chip" href="#/plan">新建长期计划</a>' +
      '<a class="chip" href="#/history">查看历史明细</a>' +
      '<button class="chip" data-act="export-csv">导出 CSV</button>' +
      '</div>' +
      '<div class="card-desc" style="margin-top:16px;line-height:1.8">' +
      '数据全部保存在本机浏览器（localStorage），断网可用；清理浏览器数据前记得先导出备份。</div>' +
      '</div></div>';
  }

  /* ================================================================
     打卡页
     ================================================================ */
  function taskCardHTML(plan, key, idx) {
    var done = A.isTaskDone(key, plan.id);
    var recs = A.recordsOfTask(key, plan.id);
    var sec = A.durationOfTask(key, plan.id);
    var timer = S.timer && S.timer.planId === plan.id && S.timer.date === key ? S.timer : null;
    var focus = A.focusOf(key, plan.id);
    var elapsed = timer ? A.timerElapsed() : 0;

    var status = timer ? '<span class="tag tag-running">' + (timer.running ? '计时中' : '已暂停') + '</span>'
      : done ? '<span class="tag tag-done">已完成 · ' + recs.length + ' 次</span>'
        : '<span class="tag tag-pending">待打卡</span>';

    var timerBox = timer ? '<div class="timer-box">' +
      '<div><div class="timer-value" data-timer-text>' + A.fmtClock(elapsed) + '</div>' +
      '<div class="timer-hint"><span class="dot-live' + (timer.running ? '' : ' paused') + '"></span> ' +
      (timer.running ? '正在专注，加油' : '已暂停，随时继续') + ' · 起始 ' + A.fmtTimeOfDay(timer.firstStartedAt) + '</div></div>' +
      '<div class="timer-actions">' +
      (timer.running
        ? '<button class="btn btn-sm" data-act="timer-pause">' + ic('ic-pause', 14) + '暂停</button>'
        : '<button class="btn btn-sm btn-primary" data-act="timer-resume" data-id="' + plan.id + '">' + ic('ic-play', 14) + '继续</button>') +
      '<button class="btn btn-sm btn-secondary" data-act="timer-stop">' + ic('ic-stop', 14) + '结束打卡</button>' +
      '</div></div>' : '';

    var recList = recs.length ? '<div class="plan-note" style="border-style:solid">' +
      recs.map(function (r) {
        return '<div style="display:flex;justify-content:space-between;gap:10px;padding:3px 0">' +
          '<span>' + A.fmtTimeOfDay(r.startedAt) + '–' + A.fmtTimeOfDay(r.endedAt) + ' · ' + A.fmtDur(r.durationSec) + '</span>' +
          '<span>' + A.masteryInfo(r.mastery).emoji + ' ' + esc(A.masteryInfo(r.mastery).text) + '</span></div>' +
          (r.note ? '<div style="color:var(--muted);font-size:12px">备注：' + esc(r.note) + '</div>' : '');
      }).join('') + '</div>' : '';

    return '<div class="card plan-item checkin-card rise' + (done ? ' done' : '') + (timer ? ' active-timer' : '') + '" ' +
      'style="--d:' + (idx * 0.06).toFixed(2) + 's">' +
      '<div class="plan-item-head"><div class="plan-task">' + esc(plan.task) + '</div>' + status + '</div>' +
      '<div class="plan-meta">' + subjectTag(plan.subject) + timeRangeHTML(plan.startTime, plan.endTime) +
      '<span class="tag tag-repeat">' + esc(A.repeatLabel(plan)) + '</span>' +
      (sec ? '<span class="tag">已投入 ' + esc(A.fmtDur(sec)) + '</span>' : '') + '</div>' +
      (focus ? '<div class="plan-focus"><span class="fl">今日具体项目：</span>' + esc(focus) + '</div>'
        : '<div class="plan-note">今日具体项目还没填，写下来更容易聚焦 ✍️</div>') +
      (plan.note ? '<div class="plan-note">备注：' + esc(plan.note) + '</div>' : '') +
      timerBox + recList +
      '<div class="plan-actions">' +
      (timer ? '' :
        '<button class="btn btn-sm ' + (done ? '' : 'btn-primary') + '" data-act="timer-start" data-id="' + plan.id + '">' +
        ic('ic-play', 14) + (done ? '再打一次' : '开始打卡') + '</button>') +
      '<button class="btn btn-sm" data-act="focus-edit" data-id="' + plan.id + '">' + ic('ic-book', 14) + '今日项目</button>' +
      (done ? '<a class="btn btn-sm" href="#/history">查看记录</a>' : '') +
      '</div></div>';
  }

  function renderCheckin(root) {
    var t = A.today();
    var plans = A.plansOfDay(t);
    var recs = A.recordsOfDay(t);
    var done = plans.filter(function (p) { return A.isTaskDone(t, p.id); }).length;
    var sec = A.totalDuration(recs);
    var pct = plans.length ? done / plans.length * 100 : 0;

    var orphan = recs.filter(function (r) {
      return !plans.some(function (p) { return p.id === r.planId; });
    });

    // 跨天未结束的计时：单独提示，结束后仍归入原日期
    var stale = '';
    if (S.timer && S.timer.date !== t) {
      var sp = A.planById(S.timer.planId);
      stale = '<div class="card rise mb-16" style="--d:.04s;border-color:var(--amber)">' +
        '<div class="card-head"><div class="card-title"><span class="dot sec"></span>有一个未结束的计时</div>' +
        '<span class="tag tag-running">' + esc(A.fmtDateCN(S.timer.date)) + '</span></div>' +
        '<div class="card-desc">' + esc(sp ? sp.subject + ' · ' + sp.task : '计划已删除') +
        '，已计时 <b data-timer-text>' + A.fmtClock(A.timerElapsed()) + '</b>。结束后会记入 ' +
        esc(A.fmtDateCN(S.timer.date, false)) + '。</div>' +
        '<div class="plan-actions"><button class="btn btn-sm btn-secondary" data-act="timer-stop">' +
        ic('ic-stop', 14) + '结束并记录</button>' +
        '<button class="btn btn-sm btn-danger" data-act="timer-discard">丢弃</button></div></div>';
    }

    var head = '<div class="card rise mb-16" style="--d:0s">' +
      '<div class="card-head"><div>' +
      '<div class="card-title"><span class="dot"></span>' + esc(A.fmtDateFull(t)) + '</div>' +
      '<div class="card-desc" style="margin-top:5px">今日 ' + plans.length + ' 项任务 · 已完成 ' + done +
      ' 项 · 累计 ' + esc(A.fmtDur(sec)) + '</div></div>' +
      '<button class="btn btn-sm btn-primary" data-act="quick-add-task">' + ic('ic-plus', 14) + '临时任务</button>' +
      '</div>' +
      '<div class="bar-track" style="height:10px"><div class="bar-fill" style="width:' + Math.max(2, pct).toFixed(1) +
      '%;background:linear-gradient(90deg,var(--primary),var(--secondary))"></div></div>' +
      '<div class="card-desc" style="margin-top:8px">完成度 ' + Math.round(pct) + '%' +
      (plans.length && done === plans.length ? ' 🎉 今天的任务全部完成，了不起！' : '') + '</div></div>';

    var list = plans.length
      ? plans.map(function (p, i) { return taskCardHTML(p, t, i); }).join('')
      : emptyState({
        emoji: '☕', title: '今天没有待打卡的任务',
        desc: '去「每日计划」添加计划，或直接建一个今日临时任务。',
        action: '<div class="chip-row" style="justify-content:center">' +
          '<a class="btn btn-primary" href="#/plan">' + ic('ic-plan', 16) + '去建计划</a>' +
          '<button class="btn" data-act="quick-add-task">' + ic('ic-plus', 16) + '临时任务</button></div>'
      });

    var orphanHTML = orphan.length ? '<div class="card rise mt-16" style="--d:.1s">' +
      '<div class="card-head"><div class="card-title"><span class="dot sec"></span>今日其它记录</div>' +
      '<span class="card-desc">来自已删除或已修改的计划</span></div>' +
      orphan.map(function (r) {
        return '<div class="plan-item"><div class="plan-item-head"><div class="plan-task">' + esc(r.task) + '</div>' +
          masteryTag(r.mastery) + '</div><div class="plan-meta">' + subjectTag(r.subject) +
          '<span class="tag">' + esc(A.fmtDur(r.durationSec)) + '</span></div></div>';
      }).join('') + '</div>' : '';

    root.innerHTML = head + stale + list + orphanHTML;
  }

  /* ================================================================
     每日计划页
     ================================================================ */
  function defaultForm() {
    return {
      id: '', subject: '', task: '', startTime: '20:00', endTime: '21:00',
      repeatType: 'daily', date: A.today(), weekdays: [A.weekdayOf(A.today())], note: ''
    };
  }

  function planFormHTML() {
    var f = ui.form || (ui.form = defaultForm());
    var editing = !!f.id;
    return '<form class="card rise" data-submit="plan-save" style="--d:0s">' +
      '<div class="card-head"><div class="card-title"><span class="dot"></span>' +
      (editing ? '编辑计划' : '新建计划') + '</div>' +
      (editing ? '<button type="button" class="btn btn-sm btn-ghost" data-act="plan-cancel">取消编辑</button>' : '') +
      '</div>' +

      '<div class="form-row"><label class="lbl" for="f-subject">科目<span class="req">*</span></label>' +
      '<input class="input" id="f-subject" name="subject" list="subject-list" autocomplete="off" ' +
      'placeholder="如：数学 / 英语 / 编程" value="' + esc(f.subject) + '">' +
      '<datalist id="subject-list">' +
      A.SUBJECT_PRESETS.concat(A.subjectsAll()).filter(function (v, i, arr) { return arr.indexOf(v) === i; })
        .map(function (s) { return '<option value="' + esc(s) + '"></option>'; }).join('') +
      '</datalist>' +
      '<div class="chip-row" style="margin-top:8px">' +
      ['数学', '英语', '编程', '阅读', '专业课'].map(function (s) {
        return '<button type="button" class="chip" data-act="pick-subject" data-v="' + esc(s) + '">' + esc(s) + '</button>';
      }).join('') + '</div></div>' +

      '<div class="form-row"><label class="lbl" for="f-task">任务描述<span class="req">*</span></label>' +
      '<textarea class="textarea" id="f-task" name="task" placeholder="如：完成函数专题 10 道选择题">' + esc(f.task) + '</textarea></div>' +

      '<div class="form-row"><div class="field-2">' +
      '<div class="time-field start"><label class="lbl" for="f-start">开始时间<span class="req">*</span></label>' +
      '<input class="input" type="time" id="f-start" name="startTime" value="' + esc(f.startTime) + '"></div>' +
      '<div class="time-field end"><label class="lbl" for="f-end">结束时间<span class="req">*</span></label>' +
      '<input class="input" type="time" id="f-end" name="endTime" value="' + esc(f.endTime) + '"></div>' +
      '</div><div class="hint">开始时间用主色、结束时间用副色标识，列表中保持一致。</div></div>' +

      '<div class="form-row"><label class="lbl" for="f-repeat">循环方式</label>' +
      '<select class="select" id="f-repeat" name="repeatType" data-change="repeat-change">' +
      '<option value="once"' + (f.repeatType === 'once' ? ' selected' : '') + '>单次（指定某一天）</option>' +
      '<option value="daily"' + (f.repeatType === 'daily' ? ' selected' : '') + '>每天</option>' +
      '<option value="weekly"' + (f.repeatType === 'weekly' ? ' selected' : '') + '>指定星期</option>' +
      '</select></div>' +

      '<div class="form-row" id="repeat-once" style="display:' + (f.repeatType === 'once' ? 'block' : 'none') + '">' +
      '<label class="lbl" for="f-date">执行日期</label>' +
      '<input class="input" type="date" id="f-date" name="date" value="' + esc(f.date) + '"></div>' +

      '<div class="form-row" id="repeat-weekly" style="display:' + (f.repeatType === 'weekly' ? 'block' : 'none') + '">' +
      '<label class="lbl">重复星期</label><div class="week-picker">' +
      A.WEEK_CN.map(function (w, i) {
        return '<button type="button" data-act="toggle-weekday" data-v="' + i + '"' +
          (f.weekdays.indexOf(i) >= 0 ? ' class="on"' : '') + '>' + w + '</button>';
      }).join('') + '</div></div>' +

      '<div class="form-row"><label class="lbl" for="f-note">备注</label>' +
      '<textarea class="textarea" id="f-note" name="note" placeholder="教材、页码、注意事项……">' + esc(f.note) + '</textarea></div>' +

      '<button class="btn btn-primary btn-block" type="submit">' +

      (editing ? '' : '<div class="hint" style="text-align:center;margin-top:10px">每天会自动生成新的一天，历史内容保留在「历史记录」</div>') +
      '</form>';
  }

  function planListHTML() {
    var t = A.today();
    var filter = ui.planFilter;
    var list = S.plans.slice().sort(function (a, b) {
      return A.timeToMin(a.startTime) - A.timeToMin(b.startTime) || b.createdAt - a.createdAt;
    });
    if (filter === 'today') list = list.filter(function (p) { return A.planAppliesTo(p, t); });
    else if (filter !== 'all') list = list.filter(function (p) { return p.repeat.type === filter; });

    var counts = {
      all: S.plans.length,
      today: S.plans.filter(function (p) { return A.planAppliesTo(p, t); }).length,
      once: S.plans.filter(function (p) { return p.repeat.type === 'once'; }).length,
      daily: S.plans.filter(function (p) { return p.repeat.type === 'daily'; }).length,
      weekly: S.plans.filter(function (p) { return p.repeat.type === 'weekly'; }).length
    };
    var chips = [['all', '全部'], ['today', '今日'], ['daily', '每天'], ['weekly', '指定星期'], ['once', '单次']]
      .map(function (c) {
        return '<button class="chip' + (filter === c[0] ? ' active' : '') + '" data-act="plan-filter" data-v="' + c[0] + '">' +
          c[1] + ' ' + counts[c[0]] + '</button>';
      }).join('');

    var body = list.length ? list.map(function (p, i) {
      var applies = A.planAppliesTo(p, t);
      var focus = A.focusOf(t, p.id);
      var done = A.isTaskDone(t, p.id);
      return '<div class="plan-item rise' + (done ? ' done' : '') + '" style="--d:' + (i * 0.05).toFixed(2) + 's">' +
        '<div class="plan-item-head"><div class="plan-task">' + esc(p.task) + '</div>' +
        (applies ? (done ? '<span class="tag tag-done">今日已完成</span>' : '<span class="tag tag-pending">今日待做</span>') : '') +
        '</div>' +
        '<div class="plan-meta">' + subjectTag(p.subject) + timeRangeHTML(p.startTime, p.endTime) +
        '<span class="tag tag-repeat">' + esc(A.repeatLabel(p)) + '</span></div>' +
        (p.note ? '<div class="plan-note">备注：' + esc(p.note) + '</div>' : '') +
        (applies
          ? (focus
            ? '<div class="plan-focus"><span class="fl">今日学习具体项目：</span>' + esc(focus) + '</div>'
            : '<div class="plan-note">今日学习具体项目：未填写</div>')
          : '') +
        '<div class="plan-actions">' +
        '<button class="btn btn-sm" data-act="plan-edit" data-id="' + p.id + '">编辑</button>' +
        (applies ? '<button class="btn btn-sm" data-act="focus-edit" data-id="' + p.id + '">' +
          (focus ? '修改今日项目' : '填写今日项目') + '</button>' : '') +
        (applies && !done ? '<button class="btn btn-sm btn-primary" data-act="goto-checkin" data-id="' + p.id + '">去打卡</button>' : '') +
        '<button class="btn btn-sm btn-danger" data-act="plan-delete" data-id="' + p.id + '">删除</button>' +
        '</div></div>';
    }).join('') : emptyState({
      emoji: '📝', title: filter === 'all' ? '还没有任何计划' : '这个筛选下没有计划',
      desc: filter === 'all' ? '在左侧填写科目与任务，开始你的第一条计划。' : '换个筛选条件看看。'
    });

    return '<div class="card-head"><div class="card-title"><span class="dot sec"></span>计划列表</div>' +
      '<span class="card-desc">' + list.length + ' 条</span></div>' +
      '<div class="chip-row mb-16">' + chips + '</div>' + body;
  }

    root.innerHTML = '<div class="plan-layout">' +
      '<div class="plan-form-wrap" id="plan-form-wrap">' + planFormHTML() + '</div>' +
      '<div class="card rise" id="plan-list-wrap" style="--d:.08s">' + planListHTML() + '</div>' +

    var w = $('#plan-form-wrap');

    if (w) w.innerHTML = planListHTML();
